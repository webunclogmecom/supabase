                  {u.name.split(' ').map(n => n[0]).slice(0, 2).join('')}
                </div>
                <div>
                  <div className="text-sm font-medium">{u.name}</div>
                  <div className="text-xs text-gray-500">{u.email}</div>
                </div>
              </div>
              <Badge tone={u.role === 'Owner' || u.role === 'Co-owner' ? 'brand' : 'gray'}>{u.role}</Badge>
            </div>
          ))}
        </div>
      </Card>
    </div>
  </div>
);

// ============================================================================
// ROUTER — Dashboard handled separately so we can pass favorites props.
// ============================================================================
const MODULE_MAP = {
  'sales-dashboard': <SalesDashboard />,
  'sales-presentation': <SalesPresentation />,
  'gdo-lookup': <GDOLookup />,
  'pipeline': <LeadPipeline />,
  'quote-builder': <QuoteBuilder />,
  'territory-map': <TerritoryMap />,
  'compliance-alerts': <ComplianceAlerts />,
  'sales-crm': <SalesCRM />,
  'sched-dashboard': <SchedDashboard />,
  'sched-monthly': <CalendarView scope="Monthly" />,
  'sched-weekly': <CalendarView scope="Weekly" />,
  'sched-daily': <CalendarView scope="Daily" />,
  'admin-dashboard': <AdminDashboard />,
  'admin-crm': <AdminCRM />,
  'visits-review': <VisitsReview />,
  'driver-review': <DriverReview />,
  'truck-stats': <TruckStats />,
  'maintenance': <Maintenance />,
  'fin-dashboard': <FinanceDashboard />,
  'ar': <ARView />,
  'ap': <APView />,
  'odoo': <OdooEmbed />,
  'settings': <Settings />,
};

// ============================================================================
// LAYOUT — Top tabs + section-scoped sidebar.
// Sidebar (when in a section): Section modules → Favorites → Recent (top to bottom).
// Dashboard tab: no sidebar, full-width main with Favorites widget at top.
// ============================================================================

const getModuleLabel = (id) => {
  if (id === 'dashboard') return 'Dashboard';
  for (const section of NAV) {
    if (section.modules) {
      const m = section.modules.find(mm => mm.id === id);
      if (m) return m.label;
    }
  }
  return id;
};

const getModuleSection = (id) => {
  if (id === 'dashboard') return 'dashboard';
  for (const section of NAV.filter(n => n.kind === 'section')) {
    if (section.modules.some(m => m.id === id)) return section.id;
  }
  return null;
};

const App = () => {
  const [activeSection, setActiveSection] = useState('dashboard');
  const [activeModule, setActiveModule] = useState('dashboard');
  const [recents, setRecents] = useState([]);
  const [fullscreen, setFullscreen] = useState(false);
  // Favorites pre-seeded with high-use modules. In rebuild: persist to
  // localStorage / Supabase user prefs.
  const [favorites, setFavorites] = useState([
    'gdo-lookup', 'sched-dashboard', 'ar', 'truck-stats',
  ]);

  // Esc exits fullscreen
  useEffect(() => {
    const onKey = (e) => { if (e.key === 'Escape') setFullscreen(false); };
    window.addEventListener('keydown', onKey);
    return () => window.removeEventListener('keydown', onKey);
  }, []);

  // Switching to a non-calendar module exits fullscreen automatically
  useEffect(() => {
    if (!activeModule.startsWith('sched-monthly') && !activeModule.startsWith('sched-weekly') && !activeModule.startsWith('sched-daily')) {
      setFullscreen(false);
    }
  }, [activeModule]);

  const sections = NAV.filter(n => n.kind === 'section');
  const currentSection = NAV.find(s => s.id === activeSection);

  const goToModule = (moduleId) => {
    setRecents(prev => {
      if (activeModule === moduleId) return prev;
      const filtered = prev.filter(id => id !== activeModule && id !== moduleId);
      return [activeModule, ...filtered].slice(0, 8);
    });
    setActiveModule(moduleId);
    const sectionId = getModuleSection(moduleId);
    if (sectionId) setActiveSection(sectionId);
  };

  const toggleFavorite = (id) => {
    setFavorites(prev => prev.includes(id) ? prev.filter(x => x !== id) : [...prev, id]);
  };

  const isFavorite = (id) => favorites.includes(id);

  const handleSectionTab = (id) => {
    if (id === 'dashboard') {
      setActiveSection('dashboard');
      setActiveModule('dashboard');
    } else {
      const sec = NAV.find(s => s.id === id);
      goToModule(sec.modules[0].id);
    }
  };

    return (
    <div className="min-h-screen bg-white flex flex-col">
      {/* TOP BAR */}
      <header className="bg-white border-b border-gray-200 sticky top-0 z-10">
        <div className="px-6 h-16 flex items-center justify-between">
          <div className="flex items-center gap-8">
            <div className="flex items-center gap-2.5">
              <div className="w-9 h-9 rounded-lg bg-brand flex items-center justify-center text-white font-bold">U</div>
              <div>
                <div className="font-bold tracking-tight text-gray-900 leading-none">UNCLOGME</div>
                <div className="text-[10px] font-bold tracking-widest text-brand-dark mt-0.5">OPS PORTAL</div>
              </div>
            </div>
            <nav className="flex items-center gap-1">
              <button
                onClick={() => handleSectionTab('dashboard')}
                className={`px-3.5 py-2 text-sm font-medium rounded-lg transition-colors ${
                  activeSection === 'dashboard'
                    ? 'bg-orange-50 text-brand-dark'
                    : 'text-gray-600 hover:text-gray-900 hover:bg-gray-50'
                }`}
              >Dashboard</button>
              {sections.map(s => (
                <button
                  key={s.id}
                  onClick={() => handleSectionTab(s.id)}
                  className={`px-3.5 py-2 text-sm font-medium rounded-lg transition-colors ${
                    activeSection === s.id
                      ? 'bg-orange-50 text-brand-dark'
                      : 'text-gray-600 hover:text-gray-900 hover:bg-gray-50'
                  }`}
                >{s.label}</button>
              ))}
            </nav>
          </div>
          <div className="flex items-center gap-3">
            <button className="text-sm text-gray-500 hover:text-gray-900">Search</button>
            <div className="w-9 h-9 rounded-full bg-brand text-white flex items-center justify-center text-xs font-bold">YA</div>
          </div>
        </div>
      </header>

      <div className="flex flex-1 min-h-0">
        {!fullscreen && (
          <aside className="w-72 bg-gray-100 border-r border-gray-200 shrink-0 flex flex-col p-3 gap-3">
            {/* SECTION MODULES — fills available space, scrolls if needed */}
            {currentSection && currentSection.modules && (
            <div className="bg-white rounded-xl border border-gray-200 p-3 flex-1 min-h-0 overflow-y-auto">
              <div className="text-[11px] font-bold tracking-widest text-brand-dark uppercase mb-2 px-2">{currentSection.label}</div>
              <div className="space-y-0.5">
                {currentSection.modules.map(m => {
                  const fav = isFavorite(m.id);
                  const isActive = activeModule === m.id;
                  const meta = MODULE_META[m.id] || { icon: '◇', tone: 'bg-gray-100 text-gray-600' };
                  return (
                    <div
                      key={m.id}
                      className={`group w-full flex items-center rounded-md text-sm transition-colors ${
                        isActive
                          ? 'bg-orange-50 text-brand-dark font-semibold'
                          : 'text-gray-600 hover:bg-gray-50 hover:text-gray-900'
                      }`}
                    >
                      <button
                        onClick={() => goToModule(m.id)}
                        className="flex-1 flex items-center gap-2.5 text-left pl-2 pr-3 py-1.5 truncate min-w-0"
                      >
                        <div className={`w-7 h-7 rounded-md flex items-center justify-center text-sm shrink-0 ${meta.tone}`}>{meta.icon}</div>
                        <span className="truncate">{m.label}</span>
                      </button>
                      <button
                        onClick={(e) => { e.stopPropagation(); toggleFavorite(m.id); }}
                        className={`px-1.5 transition-opacity ${
                          fav
                            ? 'text-amber-500 opacity-100'
                            : 'text-gray-300 opacity-0 group-hover:opacity-100 hover:text-amber-500'
                        }`}
                        title={fav ? 'Remove from favorites' : 'Add to favorites'}
                      >★</button>
                      {m.status && <div className="pr-2"><StatusPill status={m.status} /></div>}
                    </div>
                  );
                })}
              </div>
            </div>
            )}

            {/* QUICK ACTIONS — only on Dashboard tab (no section to show).
                Curated team-wide shortcuts, distinct from per-user Favorites.
                Row size matches Section modules: icon + label only, no description. */}
            {!(currentSection && currentSection.modules) && (
              <div className="bg-white rounded-xl border border-gray-200 p-3 flex-shrink-0">
                <div className="flex items-center gap-1.5 mb-2 px-2">
                  <div className="w-5 h-5 rounded bg-orange-100 text-orange-600 flex items-center justify-center text-[11px]">⚡</div>
                  <span className="text-[11px] font-bold tracking-widest text-brand-dark uppercase">Quick actions</span>
                </div>
                <div className="space-y-0.5">
                  {[
                    { id: 'gdo-lookup' },
                    { id: 'quote-builder' },
                    { id: 'territory-map' },
                  ].map(qa => {
                    const meta = MODULE_META[qa.id] || { icon: '◇', tone: 'bg-gray-100 text-gray-600' };
                    const moduleStatus = NAV
                      .flatMap(s => s.modules || [])
                      .find(m => m.id === qa.id)?.status;
                    return (
                      <button
                        key={qa.id}
                        onClick={() => goToModule(qa.id)}
                        className="w-full flex items-center gap-2.5 text-left pl-2 pr-2 py-1.5 rounded-md text-sm text-gray-600 hover:bg-gray-50 hover:text-gray-900 transition-colors"
                      >
                        <div className={`w-7 h-7 rounded-md flex items-center justify-center text-sm shrink-0 ${meta.tone}`}>{meta.icon}</div>
                        <span className="flex-1 truncate">{getModuleLabel(qa.id)}</span>
                        {moduleStatus && <StatusPill status={moduleStatus} />}
                      </button>
                    );
                  })}
                </div>
              </div>
            )}

            {/* Spacer — pushes Favorites + Recent + Settings to bottom */}
            {!(currentSection && currentSection.modules) && <div className="flex-1" />}

            {/* FAVORITES — caps at 8 rows. If you favorite more, the inner
                list scrolls but the block stays the same size, so Recent +
                Settings don't get pushed off-screen. */}
            <div className="bg-white rounded-xl border border-gray-200 p-3 flex-shrink-0">
              <div className="flex items-center justify-between mb-2 px-2">
                <div className="flex items-center gap-1.5">
                  <span className="text-amber-500 text-sm">★</span>
                  <span className="text-[11px] font-bold tracking-widest text-amber-700 uppercase">Favorites</span>
                </div>
                {favorites.length > 8 && (
                  <span className="text-[10px] text-gray-400 font-medium">{favorites.length}</span>
                )}
              </div>
              {favorites.length === 0 ? (
                <div className="text-xs text-gray-400 px-2 py-2">
                  Click ★ on a module to pin it.
                </div>
              ) : (
                <div className="space-y-0.5 overflow-y-auto" style={{ maxHeight: '264px' }}>
                  {favorites.map(id => {
                    const meta = MODULE_META[id] || { icon: '◇', tone: 'bg-gray-100 text-gray-600' };
                    return (
                      <button
                        key={id}
                        onClick={() => goToModule(id)}
                        className="w-full flex items-center gap-2.5 text-left pl-2 pr-3 py-1.5 rounded-md text-sm text-gray-600 hover:bg-gray-50 hover:text-gray-900 transition-colors"
                      >
                        <div className={`w-6 h-6 rounded-md flex items-center justify-center text-xs shrink-0 ${meta.tone}`}>{meta.icon}</div>
                        <span className="truncate">{getModuleLabel(id)}</span>
                      </button>
                    );
                  })}
                </div>
              )}
            </div>

            {/* RECENT — fixed height for 8 rows. Always rendered so the
                layout doesn't shift as you navigate. Items fill from top;
                empty space below remains. */}
            <div className="bg-white rounded-xl border border-gray-200 p-3 flex-shrink-0" style={{ minHeight: '292px' }}>
              <div className="flex items-center gap-1.5 mb-2 px-2">
                <span className="text-gray-400 text-sm">↩</span>
                <span className="text-[11px] font-bold tracking-widest text-gray-500 uppercase">Recent</span>
              </div>
              {recents.length === 0 ? (
                <div className="text-xs text-gray-400 px-2 py-2">
                  Modules you visit will appear here.
                </div>
              ) : (
                <div className="space-y-0.5">
                  {recents.map(id => {
                    const meta = MODULE_META[id] || { icon: '◇', tone: 'bg-gray-100 text-gray-600' };
                    return (
                      <button
                        key={id}
                        onClick={() => goToModule(id)}
                        className="w-full flex items-center gap-2.5 text-left pl-2 pr-3 py-1.5 rounded-md text-sm text-gray-600 hover:bg-gray-50 hover:text-gray-900 transition-colors"
                      >
                        <div className={`w-6 h-6 rounded-md flex items-center justify-center text-xs shrink-0 ${meta.tone}`}>{meta.icon}</div>
                        <span className="truncate">{getModuleLabel(id)}</span>
                      </button>
                    );
                  })}
                </div>
              )}
            </div>

            {/* SETTINGS — bottom block, same card pattern as the others */}
            <div className="bg-white rounded-xl border border-gray-200 p-3 flex-shrink-0">
              <button
                onClick={() => setActiveModule('settings')}
                className={`group w-full flex items-center gap-2.5 text-left pl-2 pr-3 py-1.5 rounded-md text-sm transition-colors ${
                  activeModule === 'settings'
                    ? 'bg-orange-50 text-brand-dark font-semibold'
                    : 'text-gray-600 hover:bg-gray-50 hover:text-gray-900'
                }`}
              >
                <div className="w-7 h-7 rounded-md bg-gray-100 text-gray-600 flex items-center justify-center text-sm shrink-0">⚙</div>
                <span>Settings</span>
              </button>
            </div>
          </aside>
        )}

        <main className="flex-1 overflow-y-auto">
          <div className={fullscreen ? 'p-4' : 'max-w-[1400px] mx-auto p-8'}>
            {activeModule === 'dashboard' ? (
              <TopDashboard
                favorites={favorites}
                getModuleLabel={getModuleLabel}
                goToModule={goToModule}
                toggleFavorite={toggleFavorite}
              />
            ) : activeModule === 'sched-monthly' ? (
              <CalendarView scope="Monthly" onScopeChange={(s) => goToModule(s === 'Day' ? 'sched-daily' : s === 'Week' ? 'sched-weekly' : 'sched-monthly')} fullscreen={fullscreen} setFullscreen={setFullscreen} />
            ) : activeModule === 'sched-weekly' ? (
              <CalendarView scope="Weekly" onScopeChange={(s) => goToModule(s === 'Day' ? 'sched-daily' : s === 'Week' ? 'sched-weekly' : 'sched-monthly')} fullscreen={fullscreen} setFullscreen={setFullscreen} />
            ) : activeModule === 'sched-daily' ? (
              <CalendarView scope="Daily" onScopeChange={(s) => goToModule(s === 'Day' ? 'sched-daily' : s === 'Week' ? 'sched-weekly' : 'sched-monthly')} fullscreen={fullscreen} setFullscreen={setFullscreen} />
            ) : (
              MODULE_MAP[activeModule] || <div className="text-gray-500">Module not implemented yet.</div>
            )}
          </div>
        </main>
      </div>
    </div>
  );
};

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
