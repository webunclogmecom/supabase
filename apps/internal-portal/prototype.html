<!--
  ============================================================================
  HANDOFF NOTES (for Lovable / Cursor / Claude Code rebuild)
  ============================================================================
  - Single-file React via CDN. No build step. Open in browser to view.
  - Aesthetic: matches existing UnclogMe Sales app
    (https://unclogme-sales.vercel.app) — soft gray sidebar, dark hero panels,
    pastel KPI tiles, three-column layout with right rail.
  - All data is mocked inline — see MOCK_DATA.
  - Iframe placeholders are clearly marked. Replace with real <iframe src=".."/>.
  - Component boundaries:
      <App> → <Sidebar> + <Main> (with optional <RightRail>)
      Each module is its own function component.
  - Brand color in CSS variables — single point of change. Currently #EA580C;
    replace with exact unclogme.com hex when available.
  - Mock data shapes ARE the contract — keep field names in the rebuild.
  - Each section has its own Dashboard. Top-level Dashboard is a rollup.
  ============================================================================
-->

<style>
  :root {
    --brand: #EA580C;
    --brand-hover: #C2410C;
    --brand-light: #FFF7ED;
    --brand-soft: #FED7AA;
  }
  body { font-family: 'Inter', system-ui, sans-serif; }
  .bg-brand { background-color: var(--brand); }
  .hover\:bg-brand-hover:hover { background-color: var(--brand-hover); }
  .bg-brand-light { background-color: var(--brand-light); }
  .text-brand { color: var(--brand); }
  .text-brand-dark { color: var(--brand-hover); }
  .border-brand { border-color: var(--brand); }

  /* Dark hero panel — matches the live UnclogMe Sales app */
  .hero-dark {
    background: radial-gradient(ellipse at top right, rgba(234,88,12,0.25) 0%, transparent 50%),
                linear-gradient(180deg, #1a1a1a 0%, #0a0a0a 100%);
  }

  .iframe-placeholder {
    background-image:
      linear-gradient(45deg, #f9fafb 25%, transparent 25%),
      linear-gradient(-45deg, #f9fafb 25%, transparent 25%),
      linear-gradient(45deg, transparent 75%, #f9fafb 75%),
      linear-gradient(-45deg, transparent 75%, #f9fafb 75%);
    background-size: 20px 20px;
    background-position: 0 0, 0 10px, 10px -10px, 10px 0px;
    background-color: #ffffff;
  }
</style>

const Card = ({ children, className = '' }) => (
  <div className={`bg-white border border-gray-200 rounded-xl ${className}`}>{children}</div>
);

const Hero = ({ pill, title, description, meta }) => (
  <div className="hero-dark rounded-2xl p-8 mb-6 relative overflow-hidden">
    {pill && (
      <div className="inline-flex items-center gap-1.5 px-3 py-1 rounded-full bg-orange-500/20 text-orange-300 text-xs font-semibold mb-4">
        <span>⚡</span> {pill}
      </div>
    )}
    <h1 className="text-3xl font-bold text-white tracking-tight">{title}</h1>
    {description && <p className="text-gray-400 mt-2 max-w-2xl">{description}</p>}
    {meta && (
      <div className="flex items-center gap-5 mt-5 text-sm text-gray-400">
        {meta.map((m, i) => (
          <div key={i} className="flex items-center gap-1.5"><span>{m.icon}</span><span>{m.label}</span></div>
        ))}
      </div>
    )}
  </div>
);

  const tones = {
    orange: 'bg-orange-100 text-orange-600',
    green: 'bg-emerald-100 text-emerald-600',
    yellow: 'bg-amber-100 text-amber-600',
    blue: 'bg-blue-100 text-blue-600',
    red: 'bg-red-100 text-red-600',
    purple: 'bg-purple-100 text-purple-600',
  };
  return (
    <div className="bg-white border border-gray-200 rounded-xl p-5 flex items-center gap-4">
      <div className={`w-11 h-11 rounded-lg flex items-center justify-center text-lg ${tones[tone]}`}>{icon}</div>
      <div>
        <div className="text-2xl font-bold text-gray-900 leading-none">{value}</div>
        <div className="text-sm font-medium text-gray-700 mt-1.5">{label}</div>
        {sublabel && <div className="text-xs text-gray-500">{sublabel}</div>}
      </div>
    </div>

};

      <h2 className="text-xl font-bold text-gray-900 tracking-tight">{title}</h2>

    </div>
    {action}

);

const Button = ({ children, variant = 'primary', size = 'md', onClick, disabled = false }) => {
  const sizes = { sm: 'px-3 py-1.5 text-xs', md: 'px-3.5 py-2 text-sm' };
  const base = `${sizes[size]} font-medium rounded-lg transition-colors`;
  const styles = disabled
    ? 'bg-gray-100 text-gray-400 cursor-not-allowed'
    : variant === 'primary'
    ? 'bg-brand hover:bg-brand-hover text-white'
    : variant === 'dark'
    ? 'bg-gray-900 hover:bg-gray-800 text-white'
    : 'bg-white text-gray-700 border border-gray-300 hover:bg-gray-50';
  return <button className={`${base} ${styles}`} onClick={disabled ? undefined : onClick} disabled={disabled}>{children}</button>;
};

const Badge = ({ children, tone = 'gray' }) => {
  const tones = {
    gray: 'bg-gray-100 text-gray-700',
    green: 'bg-emerald-50 text-emerald-700',
    yellow: 'bg-amber-50 text-amber-700',
    red: 'bg-red-50 text-red-700',
    blue: 'bg-blue-50 text-blue-700',
    brand: 'bg-orange-50 text-orange-700',
  };
  return <span className={`inline-flex items-center gap-1 px-2 py-0.5 text-xs font-medium rounded-full ${tones[tone]}`}>{children}</span>;
};

const StatusPill = ({ status }) => {
  if (!status) return null;
  const styles = status === 'LIVE'
    ? 'bg-emerald-50 text-emerald-700 border-emerald-100'
    : 'bg-gray-100 text-gray-500 border-gray-200';
  return <span className={`text-[10px] font-bold tracking-wider px-1.5 py-0.5 rounded border ${styles}`}>{status}</span>;
};

const LeadPipeline = () => {
  // Real data has just Signed: Yes/No. Distribute across stages with simple rules.
  const stages = ['New Lead', 'Quoted', 'Negotiation', 'Won'];
  const stageOf = (lead) => {
    if (lead['Signed'] === 'Yes') return 'Won';
    if (lead['Total'] && lead['GT Price']) return 'Quoted';
    if (lead['OP Email']) return 'Negotiation';
    return 'New Lead';

  const totalValue = REAL_DATA.pipeline.reduce((s, l) => s + (l['Total'] || 0), 0);

  return (
    <div>
      <Hero pill="PIPELINE" title="Lead pipeline" description="Drag cards between stages. Won deals flow to CRM and Jobber."
        meta={[
          { icon: '🔥', label: `${REAL_DATA.pipeline.length} active` },
          { icon: '💰', label: fmt$(totalValue) },
        ]} />
      <div className="grid grid-cols-4 gap-4">
        {stages.map(stage => {
          const items = REAL_DATA.pipeline.filter(p => stageOf(p) === stage);
          const total = items.reduce((s, i) => s + (i['Total'] || 0), 0);
          return (
            <div key={stage}>
              <div className="flex items-center justify-between mb-2">
                <div className="text-sm font-bold text-gray-900">{stage}</div>
                <Badge>{items.length}</Badge>

              <div className="text-xs text-gray-500 mb-3">{fmt$(total)}</div>
              <div className="space-y-2">
                {items.map((item, idx) => (
                  <Card key={idx} className="p-3 hover:border-orange-300 cursor-pointer">
                    <div className="text-sm font-semibold text-gray-900 truncate" title={item['Business Name']}>{item['Business Name']}</div>
                    <div className="text-xs text-gray-500 mt-1">{item['City'] || '—'}</div>

    </div>
  );
};

// Generate visit instances for a given month.
// PRIMARY SOURCE: REAL_DATA.upcoming — real scheduled visits with assigned trucks/drivers.
// FALLBACK: when a month has zero upcoming visits, project synthetically from
// each client's GT Next Visit + Frequency so the calendar still looks populated.
const generateMonthVisits = (year, month) => {
  const visits = [];
  const monthStart = new Date(year, month, 1);
  const monthEnd = new Date(year, month + 1, 0);
  const monthStartStr = fmtDate(monthStart);
  const monthEndStr = fmtDate(monthEnd);

  // 1. Pull real upcoming visits in this month
  const realInMonth = (REAL_DATA.upcoming || []).filter(v => {
    const d = v['Visit Date'];
    return d && d >= monthStartStr && d <= monthEndStr;
  });

  realInMonth.forEach(u => {
    const client = REAL_DATA.clients.find(c => c['Client Code'] === u['Client Code']);
    visits.push({
      date: u['Visit Date'],
      code: u['Client Code'],
      name: u['Client Name'],
      zone: u['Zone'] || client?.['Zone'],
      truck: u['Truck'] || client?.['Truck'],
      freq: client?.['GT Frequency (days)'],
      hours: `${u['Hours In'] || client?.['Hours In']}-${u['Hours Out'] || client?.['Hours Out']}`,
      gtSize: client?.['GT Size (gal)'],
      amount: u['Amount'] || 0,
      driver: u['Driver'],
      serviceType: u['Service Type'],
      _source: 'upcoming',
    });
  });

  // 2. If real data covered this month, return it. Otherwise project synthetically.
  if (visits.length > 0) return visits;

  REAL_DATA.clients.forEach((c, idx) => {
    let freq = c['GT Frequency (days)'];
    let anchor = c['GT Next Visit'] ? new Date(c['GT Next Visit']) : null;

    if (!freq || !anchor) {
      freq = freq || 30;
      const startDay = ((idx * 7 + 3) % 28) + 1;
      anchor = new Date(year, month, startDay);
    }

    let d = new Date(anchor);
    while (d > monthStart) d = new Date(d.getTime() - freq * 86400000);
    while (d <= monthEnd) {
      if (d >= monthStart) {
        visits.push({
          date: d.toISOString().slice(0, 10),
          code: c['Client Code'],
          name: c['Client Name'],
          zone: c['Zone'],
          truck: c['Truck'],
          freq,
          hours: `${c['Hours In']}-${c['Hours Out']}`,
          gtSize: c['GT Size (gal)'],
          amount: c['GT $ per Visit'] || 0,
          _source: 'projected',
        });
      }
      d = new Date(d.getTime() + freq * 86400000);
    }
  });
  return visits;
};

// Build the 6-row × 7-col grid for a month, padded with prev/next month days
const buildMonthGrid = (year, month) => {
  const first = new Date(year, month, 1);
  const startWeekday = first.getDay(); // 0 = Sun
  const daysInMonth = new Date(year, month + 1, 0).getDate();
  const cells = [];
  // Prev month tail
  const prevDays = new Date(year, month, 0).getDate();
  for (let i = startWeekday - 1; i >= 0; i--) {
    cells.push({ date: new Date(year, month - 1, prevDays - i), inMonth: false });
  }
  // Current month
  for (let d = 1; d <= daysInMonth; d++) {
    cells.push({ date: new Date(year, month, d), inMonth: true });
  }
  // Next month head — fill to 42 cells
  let next = 1;
  while (cells.length < 42) {
    cells.push({ date: new Date(year, month + 1, next++), inMonth: false });
  }
  return cells;
};

const MonthlyView = ({ onScopeChange, fullscreen, setFullscreen }) => {
  const [cursor, setCursor] = useState(new Date(2026, 4, 1)); // May 2026
  const [unscheduled, setUnscheduled] = useState([
    { id: 'u1', name: "Hiro's Sushi Express", due: '05/04', minutes: 60, zone: 'MIAMI BEACH' },
    { id: 'u2', name: '17 Restaurant and Sushi Bar', due: '05/04', minutes: 60, zone: 'MIAMI BEACH' },
    { id: 'u3', name: 'The Carrot Express (71st Coll)', due: '05/04', minutes: 60, zone: 'NMB' },
    { id: 'u4', name: 'Claudie', due: '05/04', minutes: 60, zone: 'DOWN' },
    { id: 'u5', name: 'Pura Vida (Sunset Harbor)', due: '05/05', minutes: 90, zone: 'MIAMI BEACH' },
  ]);
  // Two distinct drag types — what's being dragged determines what drop does.
  // dragPayload = { type: 'unscheduled', id } | { type: 'visit', visitKey, fromDate }
  const [dragPayload, setDragPayload] = useState(null);
  const [scheduledDrops, setScheduledDrops] = useState({}); // { 'YYYY-MM-DD': [unscheduled, ...] }
  // Per-occurrence overrides: visitKey → newDate. visitKey is a stable id for a
  // generated visit (clientCode + originalDate). Keeps original projection intact.
  const [moves, setMoves] = useState({}); // { visitKey: 'YYYY-MM-DD' }
  // Manual within-day ordering: dateStr → array of visitKeys in user-chosen order.
  // Visits not in the array fall back to natural order at the end.
  const [dayOrder, setDayOrder] = useState({}); // { 'YYYY-MM-DD': ['key1', 'key2', ...] }
  // Hover state for the drop-line indicator during reorder
  const [hoverTarget, setHoverTarget] = useState(null); // { date, beforeKey } | null
  // Multi-select zone filter. Empty set = show all.
  const [activeZones, setActiveZones] = useState(new Set());
  // Currently-selected visit (for popup). null = closed.
  const [selectedVisit, setSelectedVisit] = useState(null);
  // GDO permit modal state — set to a client object to open
  const [gdoModalClient, setGdoModalClient] = useState(null);

  const toggleZone = (zone) => setActiveZones(prev => {
    const next = new Set(prev);
    if (next.has(zone)) next.delete(zone); else next.add(zone);
    return next;
  });
  const isZoneActive = (zone) => activeZones.size === 0 || activeZones.has(zone);

  const year = cursor.getFullYear();
  const month = cursor.getMonth();
  const monthLabel = `${MONTH_NAMES[month]} ${year}`;
  const grid = buildMonthGrid(year, month);
  const generated = generateMonthVisits(year, month);

  // Apply moves: each generated visit gets a stable visitKey; if there's an
  // override in `moves`, swap its date.
  const visits = generated.map(v => {
    const visitKey = `${v.code}__${v.date}`;
    const overriddenDate = moves[visitKey];
    return { ...v, visitKey, date: overriddenDate || v.date, _origDate: v.date };
  });

  const visitsByDate = visits.reduce((acc, v) => {
    (acc[v.date] = acc[v.date] || []).push(v);
    return acc;
  }, {});
  // Merge in dropped unscheduled jobs
  Object.entries(scheduledDrops).forEach(([date, drops]) => {
    drops.forEach(d => {
      (visitsByDate[date] = visitsByDate[date] || []).push({
        date,
        code: 'NEW',
        name: d.name,
        zone: d.zone,
        truck: 'TBD',
        freq: null,
        hours: `${d.minutes}min`,
        amount: 0,
        scheduled: true,
        visitKey: `new__${d.id}`,
      });
    });
  });

  // Apply manual ordering per day. Anything not in the explicit order list
  // gets appended at the end in natural order.
  Object.keys(visitsByDate).forEach(date => {
    const order = dayOrder[date];
    if (!order) return;
    const dayVisits = visitsByDate[date];
    const indexed = new Map(dayVisits.map(v => [v.visitKey, v]));
    const ordered = [];
    order.forEach(key => {
      if (indexed.has(key)) {
        ordered.push(indexed.get(key));
        indexed.delete(key);
      }
    });
    indexed.forEach(v => ordered.push(v));
    visitsByDate[date] = ordered;
  });

  const total = visits.length + Object.values(scheduledDrops).flat().length;

  const handleDrop = (dateStr, beforeKey) => {
    if (!dragPayload) return;

    if (dragPayload.type === 'unscheduled') {
      const job = unscheduled.find(u => u.id === dragPayload.id);
      if (!job) return;
      setScheduledDrops(prev => ({
        ...prev,
        [dateStr]: [...(prev[dateStr] || []), job],
      }));
      setUnscheduled(prev => prev.filter(u => u.id !== dragPayload.id));
    } else if (dragPayload.type === 'visit') {
      const sameDay = dragPayload.fromDate === dateStr;

      if (!sameDay) {
        // Cross-day move: update the moves map
        setMoves(prev => ({ ...prev, [dragPayload.visitKey]: dateStr }));
      }

      // Whether same-day reorder or cross-day move, if a beforeKey is given,
      // recompute the ordered key list for the target day.
      if (beforeKey !== undefined) {
        setDayOrder(prev => {
          // Build current ordering for the target day from what's about to be visible.
          const currentList = (visitsByDate[dateStr] || []).map(v => v.visitKey);
          // If cross-day, the dragged key isn't in the target day yet — insert it.
          let working = currentList.filter(k => k !== dragPayload.visitKey);
          const insertAt = beforeKey === null ? working.length : working.indexOf(beforeKey);
          if (insertAt === -1) working.push(dragPayload.visitKey);
          else working.splice(insertAt, 0, dragPayload.visitKey);

// Daily and Weekly remain placeholders for now — we'll design these next.
// ============================================================================
// WEEKLY VIEW — hourly grid, day/night toggle, lane vs combined modes
// ============================================================================

// Day-of-week starts (Sunday) for a given date
const startOfWeek = (d) => {
  const x = new Date(d);
  x.setHours(0, 0, 0, 0);
  x.setDate(x.getDate() - x.getDay());
  return x;
};

// Build a list of hour rows for day or night mode.
// Day: 00:00 → 23:00 (24 rows, label = "HH:00")
// Night: 17:00 → 23:00, then 00:00→16:00 next day (24 rows, +1 label for next-day hours)
const buildHourRows = (mode) => {
  if (mode === 'day') {
    return Array.from({ length: 24 }, (_, h) => ({ hour: h, label: String(h).padStart(2, '0') + ':00', nextDay: false }));
  }
  // night: 17..23, then 0..16 (+1)
  const rows = [];
  for (let h = 17; h <= 23; h++) rows.push({ hour: h, label: String(h).padStart(2, '0') + ':00', nextDay: false });
  for (let h = 0; h <= 16; h++) rows.push({ hour: h, label: String(h).padStart(2, '0') + ':00', nextDay: true });
  return rows;
};

// Which calendar date does an hour row belong to, given a column's date?
const rowDate = (colDate, row) => {
  if (!row.nextDay) return colDate;
  const d = new Date(colDate);
  d.setDate(d.getDate() + 1);
  return d;
};

// Parse "HH:MM" → hour (rounded down)
const parseHour = (hhmm) => {
  if (!hhmm) return null;
  const [h] = hhmm.split(':');
  return parseInt(h, 10);
};

// Get truck name from a client's "Truck" field. Real data has things like
// "INT, 5,000" or "David 2,000" or "Goliath 5,000". Pull the first word.
const truckOf = (truckField) => {
  if (!truckField) return null;
  const t = String(truckField).split(/[\s,]/)[0].trim();
  // Map common shorthands
  if (t === 'INT') return 'Goliath'; // INT trucks → assume Goliath in absence of better data
  return t;
};

// Truck → single letter for the chip badge.
const truckLetter = (truckName) => {
  if (!truckName) return '?';
  // First letter, uppercase. Goliath→G, Moises→M, Cloggy→C, David→D
  return truckName.charAt(0).toUpperCase();
};

// Deterministic truck → driver mapping for the prototype.
// Real data has 9 drivers but no per-visit assignments. In production this
// pulls from Jobber visit.assignedTo.
const TRUCK_DRIVER = {
  'David':   'Diego Hernandez',
  'Moises':  'Pablo',
  'Cloggy':  'Brian',
  'Goliath': 'Andres Machado',
};
const driverForTruck = (truckName) => TRUCK_DRIVER[truckName] || 'Unassigned';

// Get initials from a full name. "Andres Machado" → "AM", "Pablo" → "P".
const initials = (name) => {
  if (!name) return '?';
  const parts = name.trim().split(/\s+/);
  if (parts.length === 1) return parts[0].charAt(0).toUpperCase();
  return (parts[0].charAt(0) + parts[parts.length - 1].charAt(0)).toUpperCase();
};

// Parse client "Days of Week" string like "mon, tue, wed, thu, fri, sat, sun"
// → Set of weekday indexes (0=Sun, 1=Mon, ..., 6=Sat).
const DAY_INDEX = { sun: 0, mon: 1, tue: 2, wed: 3, thu: 4, fri: 5, sat: 6 };
const parseAllowedDays = (daysStr) => {
  if (!daysStr) return new Set([0, 1, 2, 3, 4, 5, 6]); // null = no restriction
  const set = new Set();
  String(daysStr).toLowerCase().split(',').forEach(p => {
    const k = p.trim().slice(0, 3);
    if (k in DAY_INDEX) set.add(DAY_INDEX[k]);
  });
  return set.size > 0 ? set : new Set([0, 1, 2, 3, 4, 5, 6]);
};

// Check if a given hour is within the [hoursIn, hoursOut] window for a client.
// Window may wrap midnight (e.g., 21:00 → 05:00).
const isHourAllowed = (hour, hoursInStr, hoursOutStr) => {
  const inH = parseHour(hoursInStr);
  const outH = parseHour(hoursOutStr);
  if (inH == null || outH == null) return true; // no restriction
  if (inH === outH) return true; // 24-hour window
  if (inH < outH) {
    // Same-day window like 06:00-18:00
    return hour >= inH && hour < outH;
  }
  // Wrap-midnight window like 21:00-05:00
  return hour >= inH || hour < outH;
};

// Compute conflict status for a visit at a given (date, hour).
// Returns { dayConflict: bool, hourConflict: bool, allowedDays: Set<int> }
const computeConflicts = (visit, dateStr, hour) => {
  const client = REAL_DATA.clients.find(cl => cl['Client Code'] === visit.code);
  if (!client) return { dayConflict: false, hourConflict: false, allowedDays: new Set([0,1,2,3,4,5,6]), client: null };
  const allowedDays = parseAllowedDays(client['Days of Week']);
  const d = new Date(dateStr);
  const dayConflict = !allowedDays.has(d.getDay());
  const hourConflict = hour != null && !isHourAllowed(hour, client['Hours In'], client['Hours Out']);
  return { dayConflict, hourConflict, allowedDays, client };
};

// Today as a YYYY-MM-DD for late detection
const TODAY_STR = fmtDate(new Date());
const isLate = (visit) => visit.date < TODAY_STR; // simple: past date = late (would also check "not completed" in production)

// Mini weekday strip — returns an array of {letter, status} for rendering.
// status: 'allowed' | 'disallowed' | 'conflict' (the day this visit is on, if disallowed)
const weekdayStrip = (allowedDays, visitDay) => {
  // Order: M T W T F S S (Mon..Sun for European-ish reading) — we'll honor that
  const order = [1, 2, 3, 4, 5, 6, 0];
  const letters = ['M', 'T', 'W', 'T', 'F', 'S', 'S'];
  return order.map((dayIdx, i) => {
    const allowed = allowedDays.has(dayIdx);
    const isVisitDay = dayIdx === visitDay;
    let status = allowed ? 'allowed' : 'disallowed';
    if (isVisitDay && !allowed) status = 'conflict';
    return { letter: letters[i], status, isVisitDay };
  });
};

  const [selectedVisit, setSelectedVisit] = useState(null);
  // GDO permit modal state — set to a client object to open
  const [gdoModalClient, setGdoModalClient] = useState(null);
  const [activeZones, setActiveZones] = useState(new Set());
  // Per-occurrence overrides for drag-to-reschedule.
  // Key = original visitKey; Value = { date, hour, truck }
  const [moves, setMoves] = useState({});
  const [dragPayload, setDragPayload] = useState(null); // { visitKey, fromCellKey }

  const toggleZone = (zone) => setActiveZones(prev => {
    const next = new Set(prev);
    if (next.has(zone)) next.delete(zone); else next.add(zone);
    return next;
  });
  const isZoneActive = (zone) => activeZones.size === 0 || activeZones.has(zone);

  const weekStart = startOfWeek(cursor);
  const days = Array.from({ length: 7 }, (_, i) => {
    const d = new Date(weekStart);
    d.setDate(weekStart.getDate() + i);
    return d;
  });

  const monthLabel = `${days[0].toLocaleDateString('en-US', { month: 'short', day: 'numeric' })} – ${days[6].toLocaleDateString('en-US', { month: 'short', day: 'numeric' })}, ${days[6].getFullYear()}`;

  // Generate base visits for all months touched by visible week
  const monthsTouched = new Set();
  days.forEach(d => monthsTouched.add(`${d.getFullYear()}-${d.getMonth()}`));
  const allVisits = [];
  monthsTouched.forEach(key => {
    const [y, m] = key.split('-').map(Number);
    allVisits.push(...generateMonthVisits(y, m));
  });

  // Apply moves overrides + zone filter
  const dayKeys = new Set(days.map(d => fmtDate(d)));
  if (shiftMode === 'night') {
    days.forEach(d => {
      const next = new Date(d); next.setDate(next.getDate() + 1);
      dayKeys.add(fmtDate(next));
    });
  }

  const weekVisits = allVisits
    .map(v => {
      const visitKey = `${v.code}__${v.date}`;
      const override = moves[visitKey];
      const finalDate = override?.date || v.date;
      const finalHour = override?.hour !== undefined ? override.hour : parseHour(v.hours.split('-')[0]);
      const finalTruck = override?.truck || truckOf(v.truck);
      return {
        ...v,
        visitKey,
        date: finalDate,
        startHour: finalHour,
        truckName: finalTruck,
        moved: !!override,
        _origDate: v.date,
        _origHour: parseHour(v.hours.split('-')[0]),
      };
    })
    .filter(v => dayKeys.has(v.date))
    .filter(v => isZoneActive(v.zone));

  const hourRows = buildHourRows(shiftMode);

  // Group visits by (date, hour) for combined layout
  const visitsByCell = {};
  weekVisits.forEach(v => {
    const k = `${v.date}__${v.startHour}`;
    (visitsByCell[k] = visitsByCell[k] || []).push(v);
  });

  // Per-day stats for the column header.
  // A visit is "in" a day column only if its time slot is rendered there in the current shift mode:
  //   day mode: visit.date == column date (any hour)
  //   night mode: (visit.date == column date AND hour 17-23) OR (visit.date == column+1 date AND hour 0-16)
  const dayStats = days.map(d => {
    const colDate = fmtDate(d);
    const next = new Date(d); next.setDate(next.getDate() + 1);
    const nextDate = fmtDate(next);
    const vs = weekVisits.filter(v => {
      if (shiftMode === 'day') return v.date === colDate;
      if (v.date === colDate && v.startHour >= 17) return true;
      if (v.date === nextDate && v.startHour <= 16) return true;
      return false;
    });
    const total = vs.reduce((s, v) => s + (v.amount || 0), 0);
    return { count: vs.length, total };
  });

  // Total this-week stats: sum of what's actually visible across all columns
  const visibleVisitCount = dayStats.reduce((s, d) => s + d.count, 0);
  const visibleVisitTotal = dayStats.reduce((s, d) => s + d.total, 0);

  const todayStr = fmtDate(new Date());

  // Zoom controls row height + chip detail level
  const rowHeight = zoom === 'compact' ? 28 : zoom === 'regular' ? 44 : 72;
  const chipPadding = zoom === 'compact' ? 'px-1 py-0' : zoom === 'regular' ? 'px-1.5 py-0.5' : 'px-2 py-1';
  const chipFontSize = zoom === 'compact' ? 'text-[9px]' : zoom === 'regular' ? 'text-[10px]' : 'text-[11px]';
  const showFullDetail = zoom === 'expanded';

  const shiftLabel = shiftMode === 'day' ? 'Day: 00:00 - 24:00' : 'Night: 17:00 - 17:00 (+1)';
  const shiftIcon = shiftMode === 'day' ? '☀' : '🌙';

  // Drag handlers
  const handleDragStart = (visit, fromCellKey) => {
    setDragPayload({ visitKey: visit.visitKey, fromCellKey });
  };
  const handleDrop = (date, hour) => {
    if (!dragPayload) return;
    setMoves(prev => ({
      ...prev,
      [dragPayload.visitKey]: { date, hour },
    }));
    setDragPayload(null);
  };

  return (
    <div>
      <div className="flex items-center justify-between mb-5">
        <div>
          <div className="flex items-center gap-2.5">
            <div className="w-1 h-6 rounded-full bg-brand"></div>
            <h1 className="text-xl font-bold text-gray-900 tracking-tight">Weekly schedule</h1>
            <Badge tone="brand">Dispatch</Badge>
          </div>
          <div className="flex items-center gap-4 mt-1.5 ml-3.5 text-xs text-gray-500">
            <span>📅 {visibleVisitCount} visits this week</span>
            <span>🚛 {REAL_DATA.trucks.length} trucks</span>
            {Object.keys(moves).length > 0 && <span className="text-brand-dark">{Object.keys(moves).length} moved</span>}
          </div>
        </div>
      </div>

      <CalendarToolbar
        scope="Week"
        monthLabel={monthLabel}
        onPrev={() => { const c = new Date(cursor); c.setDate(c.getDate() - 7); setCursor(c); }}
        onNext={() => { const c = new Date(cursor); c.setDate(c.getDate() + 7); setCursor(c); }}
        onToday={() => setCursor(new Date())}
        onScopeChange={onScopeChange}
      />

      <div className="flex items-center justify-between mb-3 gap-3 flex-wrap">
        {/* Zoom toggle */}
        <div className="flex items-center bg-gray-100 rounded-lg p-0.5">
          <button
            onClick={() => setZoom('compact')}
            title="Compact rows"
            className={`px-2.5 py-1.5 text-xs font-semibold rounded-md ${zoom === 'compact' ? 'bg-white text-gray-900 shadow-sm' : 'text-gray-600 hover:text-gray-900'}`}
          >▬</button>
          <button
            onClick={() => setZoom('regular')}
            title="Regular rows"
            className={`px-2.5 py-1.5 text-xs font-semibold rounded-md ${zoom === 'regular' ? 'bg-white text-gray-900 shadow-sm' : 'text-gray-600 hover:text-gray-900'}`}
          >═</button>
          <button
            onClick={() => setZoom('expanded')}
            title="Expanded rows (more detail per visit)"
            className={`px-2.5 py-1.5 text-xs font-semibold rounded-md ${zoom === 'expanded' ? 'bg-white text-gray-900 shadow-sm' : 'text-gray-600 hover:text-gray-900'}`}
          >☰</button>
          <span className="text-[10px] text-gray-500 px-2">{zoom}</span>
        </div>

        {/* Day/Night toggle */}
        <button
          onClick={() => setShiftMode(shiftMode === 'day' ? 'night' : 'day')}
          className="flex items-center gap-2 px-3 py-1.5 border border-gray-300 rounded-lg text-sm font-medium hover:bg-gray-50 bg-white"
        >
          <span className={shiftMode === 'day' ? 'text-amber-500' : 'text-indigo-500'}>{shiftIcon}</span>
          <span className="text-gray-700">{shiftLabel}</span>
        </button>

        {/* Fullscreen toggle */}
        <button
          onClick={() => setFullscreen(!fullscreen)}
          title={fullscreen ? 'Exit fullscreen (Esc)' : 'Expand to fullscreen'}
          className="flex items-center gap-1.5 px-3 py-1.5 border border-gray-300 rounded-lg text-sm font-medium hover:bg-gray-50 bg-white"
        >
          <span className="text-gray-600">{fullscreen ? '⤓' : '⤢'}</span>
          <span className="text-gray-700">{fullscreen ? 'Exit fullscreen' : 'Fullscreen'}</span>
        </button>
      </div>

      <div className={fullscreen ? 'block' : 'grid grid-cols-[1fr_280px] gap-4'}>
        {/* WEEK GRID */}
        <Card className="p-0 overflow-hidden">
          <div className="overflow-auto" style={{ maxHeight: fullscreen ? 'calc(100vh - 220px)' : '70vh' }}>
            <table className="w-full border-collapse" style={{ tableLayout: 'fixed' }}>
              <colgroup>
                <col style={{ width: '60px' }} />
                {days.map((_, i) => <col key={i} />)}
              </colgroup>
              <thead className="sticky top-0 bg-white z-10">
                <tr className="border-b border-gray-200">
                  <th className="bg-gray-50"></th>
                  {days.map((d, i) => {
                    const ds = fmtDate(d);
                    const isToday = ds === todayStr;
                    return (
                      <th key={i} className={`px-2 py-2 border-l border-gray-200 ${isToday ? 'bg-orange-50' : 'bg-gray-50'}`}>
                        <div className="text-[10px] font-bold tracking-wider text-gray-500 uppercase">{['Sun','Mon','Tue','Wed','Thu','Fri','Sat'][d.getDay()]}</div>
                        <div className={`text-base font-bold ${isToday ? 'text-brand-dark' : 'text-gray-900'}`}>{d.getDate()}</div>
                        <div className="flex items-center justify-center gap-2 text-[10px] text-gray-500 mt-0.5">
                          <span>📋 {dayStats[i].count}</span>
                          <span>·</span>
                          <span className="font-mono">{fmt$(dayStats[i].total)}</span>
                        </div>
                      </th>
                    );
                  })}
                </tr>
              </thead>
              <tbody>
                {hourRows.map((row, ri) => (
                  <tr key={ri} className="border-b border-gray-100">
                    <td className={`px-1.5 py-0 text-[10px] font-mono align-top ${row.nextDay ? 'text-gray-400 bg-gray-50/50' : 'text-gray-500'}`} style={{ height: `${rowHeight}px` }}>
                      {row.label}{row.nextDay && <sup className="text-[8px]">+1</sup>}
                    </td>
                    {days.map((d, di) => {
                      const cellDate = fmtDate(rowDate(d, row));
                      const visits = visitsByCell[`${cellDate}__${row.hour}`] || [];
                      const isToday = cellDate === todayStr;
                      const isDropTarget = dragPayload && dragPayload.fromCellKey !== `${cellDate}__${row.hour}`;
                      return (
                        <td
                          key={di}
                          onDragOver={(e) => {
                            e.preventDefault();
                            if (isDropTarget) e.currentTarget.classList.add('bg-orange-100');
                          }}
                          onDragLeave={(e) => e.currentTarget.classList.remove('bg-orange-100')}
                          onDrop={(e) => {
                            e.preventDefault();
                            e.currentTarget.classList.remove('bg-orange-100');
                            handleDrop(cellDate, row.hour);
                          }}
                          className={`border-l border-gray-100 p-0.5 align-top ${row.nextDay ? 'bg-gray-50/30' : 'bg-white'} ${isToday && !row.nextDay ? 'bg-orange-50/40' : ''}`}
                          style={{ height: `${rowHeight}px` }}
                        >
                          {visits.map((v, vi) => {
                            const c = zoneColor(v.zone);
                            const isDragging = dragPayload?.visitKey === v.visitKey;
                            const driver = driverForTruck(v.truckName);
                            const conflicts = computeConflicts(v, v.date, v.startHour);
                            const visitDayIdx = new Date(v.date).getDay();
                            const strip = weekdayStrip(conflicts.allowedDays, visitDayIdx);
                            const late = isLate(v);
                            const hasAnyConflict = conflicts.dayConflict || conflicts.hourConflict;
                            // Tooltip surfaces all warnings
                            const tooltipParts = [`${v.code} · ${v.name}`, `${v.truckName} · ${driver}`, `${v.hours} · ${fmt$(v.amount)}`];
                            if (late) tooltipParts.push('⚠ LATE');
                            if (conflicts.dayConflict) tooltipParts.push(`⚠ Day conflict — client is closed on ${['Sun','Mon','Tue','Wed','Thu','Fri','Sat'][visitDayIdx]}`);
                            if (conflicts.hourConflict) tooltipParts.push(`⚠ Time conflict — outside ${conflicts.client?.['Hours In']}–${conflicts.client?.['Hours Out']} window`);
                            if (v.moved) tooltipParts.push('moved');
                            return (
                              <div
                                key={v.visitKey + vi}
                                draggable
                                onDragStart={() => handleDragStart(v, `${cellDate}__${row.hour}`)}
                                onDragEnd={() => setDragPayload(null)}
                                onClick={() => setSelectedVisit(v)}
                                title={tooltipParts.join('\n')}
                                className={`${chipPadding} rounded ${chipFontSize} leading-tight ${c.bg} ${c.text} font-medium cursor-grab active:cursor-grabbing mb-0.5 ${isDragging ? 'opacity-30' : ''} ${v.moved ? 'ring-1 ring-brand' : ''} ${hasAnyConflict ? 'ring-2 ring-red-400' : ''}`}
                              >
                                {/* TOP LINE — code + name + (truck, driver, late icon) on the right */}
                                <div className="flex items-center gap-1">
                                  <span className="font-mono shrink-0">{v.code}</span>
                                  <span className="truncate flex-1 min-w-0">{v.name}</span>
                                  {/* Right-side badges */}
                                  <div className="flex items-center gap-0.5 shrink-0">
                                    {late && <span className="text-red-500 text-[10px]" title="Late">⚠</span>}
                                    <span className="inline-flex items-center justify-center w-3.5 h-3.5 rounded-sm bg-slate-800 text-white text-[8px] font-bold leading-none">{truckLetter(v.truckName)}</span>
                                    <span className="inline-flex items-center justify-center min-w-[14px] h-3.5 px-0.5 rounded-sm bg-slate-800 text-white text-[8px] font-bold leading-none">{initials(driver)}</span>
                                  </div>
                                </div>
                                {/* MTWTFSS day strip + time — only in regular and expanded zooms */}
                                {zoom !== 'compact' && (
                                  <div className="flex items-center gap-1 mt-0.5 text-[9px]">
                                    <span className="font-mono font-bold tracking-tight">
                                      {strip.map((s, si) => (
                                        <span
                                          key={si}
                                          className={
                                            s.status === 'conflict' ? 'text-red-600' :
                                            s.status === 'allowed'  ? 'text-emerald-600' :
                                                                       'text-gray-400'
                                          }
                                          style={{ textDecoration: s.isVisitDay ? 'underline' : 'none' }}
                                          title={s.status}
                                        >{s.letter}</span>
                                      ))}
                                    </span>
                                    <span className={`font-mono ml-1 ${conflicts.hourConflict ? 'text-red-600 font-bold' : 'opacity-70'}`}>{v.hours}</span>
                                    {showFullDetail && <span className="ml-auto opacity-70">{fmt$(v.amount)}</span>}
                                  </div>
                                )}
                              </div>
                            );
                          })}
                        </td>
                      );
                    })}
                  </tr>
                ))}
              </tbody>
            </table>
          </div>
        </Card>

        {/* RIGHT RAIL — hidden in fullscreen */}
        {!fullscreen && (<div className="space-y-4">
          <Card className="p-4">
            <div className="flex items-center justify-between mb-3">
              <div className="text-[11px] font-bold tracking-widest text-gray-500 uppercase">Filter by zone</div>
              {activeZones.size > 0 && (
                <button onClick={() => setActiveZones(new Set())} className="text-[10px] text-brand-dark hover:underline">Show all</button>
              )}
            </div>
            <div className="space-y-1">
              {Object.entries(ZONE_COLORS).map(([zone, c]) => {
                const active = activeZones.has(zone);
                const dimmed = activeZones.size > 0 && !active;
                return (
                  <button
                    key={zone}
                    onClick={() => toggleZone(zone)}
                    className={`w-full flex items-center gap-2 text-xs px-2 py-1 rounded-md text-left transition-all ${active ? 'bg-orange-50 ring-1 ring-orange-300' : 'hover:bg-gray-50'} ${dimmed ? 'opacity-40' : ''}`}
                  >
                    <span className={`w-3 h-3 rounded ${c.bg} border border-gray-200`}></span>
                    <span className={active ? 'text-brand-dark font-semibold' : 'text-gray-700'}>{zone}</span>
                    {active && <span className="ml-auto text-brand-dark text-[10px]">✓</span>}
                  </button>
                );
              })}
            </div>
          </Card>

          <Card className="p-4">
            <div className="flex items-center justify-between mb-2">
              <div className="text-[11px] font-bold tracking-widest text-gray-500 uppercase">This week</div>
              {Object.keys(moves).length > 0 && (
                <button onClick={() => setMoves({})} className="text-[10px] text-brand-dark hover:underline">Reset moves</button>
              )}
            </div>
            <div className="space-y-1.5 text-xs">
              <div className="flex justify-between"><span className="text-gray-500">Total visits</span><span className="font-semibold">{visibleVisitCount}</span></div>
              {Object.keys(moves).length > 0 && (
                <div className="flex justify-between"><span className="text-gray-500">Moved</span><span className="font-semibold text-brand-dark">{Object.keys(moves).length}</span></div>
              )}
              <div className="flex justify-between pt-1.5 border-t border-gray-200"><span className="text-gray-500">Total invoiced</span><span className="font-semibold text-brand-dark font-mono">{fmt$(visibleVisitTotal)}</span></div>
            </div>
          </Card>

          <Card className="p-4">
            <div className="text-[11px] font-bold tracking-widest text-gray-500 uppercase mb-2">Tip</div>
            <div className="text-xs text-gray-600 leading-relaxed">
              <span className="font-semibold">Drag chips</span> to reschedule. Use the <span className="font-semibold">zoom toggle</span> to expand rows for full visit detail. <span className="font-semibold">Night</span> mode wraps from 17:00 across midnight.
            </div>
          </Card>
        </div>)}
      </div>

      {/* DRAWER */}
      {selectedVisit && (() => {
        const v = selectedVisit;
        const c = zoneColor(v.zone);
        const client = REAL_DATA.clients.find(cl => cl['Client Code'] === v.code);
        const driver = driverForTruck(v.truckName);
        const conflicts = computeConflicts(v, v.date, v.startHour);
        const late = isLate(v);

        // Pull last 3 visits for this client from REAL_DATA.schedule (real photo URLs)
        const recentVisits = REAL_DATA.schedule
          .filter(s => s['Client Code'] === v.code)
          .slice(0, 3);

        // AR exposure for this client
        const arForClient = REAL_DATA.ar.filter(a => a['Client Code'] === v.code);
        const arTotal = arForClient.reduce((s, a) => s + (a['Amount Due'] || 0), 0);

        // GDO expiration check
        const gdoExp = client?.['GDO Expiration'] ? new Date(client['GDO Expiration']) : null;
        const today = new Date(TODAY_STR);
        const gdoExpired = gdoExp && gdoExp < today;
        const gdoSoon = gdoExp && !gdoExpired && (gdoExp - today) / 86400000 < 60;

        // Fake YTD service history (no real source in spreadsheet)
        const visitsYTD = client?.['GT Frequency (days)']
          ? Math.floor((today.getMonth() + 1) * 30 / client['GT Frequency (days)'])
          : 0;
        const revenueYTD = visitsYTD * (client?.['GT $ per Visit'] || 0);

        return (
          <div className="fixed inset-y-0 right-0 z-40 w-[440px] bg-white border-l border-gray-200 shadow-2xl flex flex-col" style={{ animation: 'slideIn 0.2s ease-out' }}>
            {/* Header */}
            <div className="px-5 py-4 border-b border-gray-200 flex items-start justify-between">
              <div className="min-w-0 flex-1">
                <div className="flex items-center gap-2 mb-1">
                  <span className={`w-2 h-2 rounded-full ${c.dot}`}></span>
                  <span className="text-[10px] font-bold tracking-widest text-gray-500 uppercase">{v.zone}</span>
                  <span className="text-[10px] font-mono text-gray-400">{v.code}</span>
                </div>
                <div className="text-base font-bold text-gray-900 truncate" title={v.name}>{v.name}</div>
                <div className="text-xs text-gray-500 mt-0.5">{v.date} · {v.hours}</div>
              </div>
              <button onClick={() => setSelectedVisit(null)} className="text-gray-400 hover:text-gray-700 text-xl leading-none px-2">×</button>
            </div>

            <div className="flex-1 overflow-y-auto p-5 space-y-5">
              {/* CONFLICTS BANNER — top of drawer if any issues */}
              {(late || conflicts.dayConflict || conflicts.hourConflict || gdoExpired || gdoSoon) && (
                <div className="rounded-lg border border-red-200 bg-red-50 p-3 space-y-1.5">
                  <div className="text-[11px] font-bold tracking-widest text-red-700 uppercase">⚠ Issues</div>
                  {late && <div className="text-xs text-red-700 flex items-center gap-1.5"><span>⚠</span> Visit is in the past — overdue or missed</div>}
                  {conflicts.dayConflict && <div className="text-xs text-red-700 flex items-center gap-1.5"><span>⚠</span> Day conflict — client closed on {['Sun','Mon','Tue','Wed','Thu','Fri','Sat'][new Date(v.date).getDay()]}</div>}
                  {conflicts.hourConflict && <div className="text-xs text-red-700 flex items-center gap-1.5"><span>⚠</span> Time conflict — outside {client?.['Hours In']}–{client?.['Hours Out']} window</div>}
                  {gdoExpired && <div className="text-xs text-red-700 flex items-center gap-1.5"><span>⚠</span> GDO permit EXPIRED ({client['GDO Expiration']})</div>}
                  {gdoSoon && <div className="text-xs text-amber-700 flex items-center gap-1.5"><span>⏰</span> GDO permit expires soon ({client['GDO Expiration']})</div>}
                </div>
              )}

              {/* SERVICE */}
              <div>
                <div className="text-[11px] font-bold tracking-widest text-gray-500 uppercase mb-2">Service</div>
                <div className="space-y-2 text-sm">
                  <div className="flex justify-between"><span className="text-gray-500">Service type</span><span className="font-medium">{client?.['Service Type'] || 'Grease Trap'}</span></div>
                  <div className="flex justify-between"><span className="text-gray-500">Frequency</span><span className="font-medium">{v.freq ? `${v.freq} days` : '—'}</span></div>
                  <div className="flex justify-between"><span className="text-gray-500">GT size</span><span className="font-medium">{v.gtSize ? `${v.gtSize} gal` : '—'}</span></div>
                  <div className="flex justify-between"><span className="text-gray-500">Manholes</span><span className="font-medium">{client?.['Manholes'] || '—'}</span></div>
                  <div className="flex justify-between"><span className="text-gray-500">Allowed hours</span><span className="font-medium font-mono text-xs">{client?.['Hours In']}–{client?.['Hours Out']}</span></div>
                  <div className="flex justify-between"><span className="text-gray-500">Amount</span><span className="font-bold text-brand-dark">{fmt$(v.amount)}</span></div>
                </div>
              </div>

              {/* ASSIGNMENT */}
              <div>
                <div className="text-[11px] font-bold tracking-widest text-gray-500 uppercase mb-2">Assignment</div>
                <div className="space-y-2.5 text-sm">
                  <div>
                    <label className="text-xs text-gray-500 block mb-1">Truck</label>
                    <select className="w-full px-3 py-2 border border-gray-300 rounded-lg text-sm" defaultValue={v.truckName}>
                      {REAL_DATA.trucks.map(t => <option key={t['Vehicle Name']}>{t['Vehicle Name']}</option>)}
                    </select>
                  </div>
                  <div>
                    <label className="text-xs text-gray-500 block mb-1">Driver</label>
                    <select className="w-full px-3 py-2 border border-gray-300 rounded-lg text-sm" defaultValue={driver}>
                      <option>Unassigned</option>
                      {REAL_DATA.drivers.map(d => <option key={d['Full Name']}>{d['Full Name']}</option>)}
                    </select>
                  </div>
                </div>
              </div>

              {/* LOCATION + GDO */}
              {client && (
                <div>
                  <div className="text-[11px] font-bold tracking-widest text-gray-500 uppercase mb-2">Location</div>
                  <div className="text-sm font-medium text-gray-900">{client['Address']}</div>
                  <div className="text-xs text-gray-500">{client['City']}, FL · {client['County']}</div>
                  {client['GDO Number'] && (
                    <div className="mt-2 flex items-center gap-2">
                      <button
                        onClick={() => setGdoModalClient(client)}
                        className="hover:opacity-80 transition-opacity"
                        title="Click for permit details"
                      >
                        <Badge tone={gdoExpired ? 'red' : gdoSoon ? 'yellow' : 'brand'}>📄 {client['GDO Number']}</Badge>
                      </button>
                      <span className="text-[10px] text-gray-500">exp {client['GDO Expiration']}</span>
                    </div>
                  )}
                </div>
              )}

              {/* CONTACT */}
              <div>
                <div className="text-[11px] font-bold tracking-widest text-gray-500 uppercase mb-2">Contact</div>
                <div className="space-y-1.5 text-sm">
                  <div className="flex items-center gap-2">
                    <span className="w-5 text-gray-400">📞</span>

// VISITS REVIEW — Grease Buddy-style admin review queue
// ----------------------------------------------------------------------------
// Two-level review workflow:
//   1. SHIFT-level: pre/post inspection forms (driver, gas level, sludge, etc.)
//   2. VISIT-level: per-job photo classification + bonus + quality + invoice
//
// UX improvements over the original Lovable app:
//   - Bulk approve from queue
//   - Hover preview on photos
//   - Keyboard nav (J/K = prev/next visit, A = approve all, Esc = back)
//   - Sticky action bar in detail view
//   - Smart problem grouping (missing photos surface to top)
// ============================================================================

// Mock review state generator — deterministic per visit so reloads are stable
const reviewMock = (visit, idx) => {
  // Status distribution: 80% pending, 15% complete, 5% flagged
  const seed = (visit.code || '').charCodeAt(0) + idx;
  const statusRoll = seed % 20;
  let status = 'pending';
  if (statusRoll < 1) status = 'flagged';
  else if (statusRoll < 4) status = 'complete';
  // Photo count: 2-7 photos
  const photoCount = 2 + (seed % 6);
  const required = 4;
  // Photo classification (in real app, driver dumps all then admin tags)
  // Mock: when status is complete, photos are classified
  const classified = status === 'complete' ? photoCount : 0;
  return {
    status,
    bonus: 10 + (seed % 3) * 5, // $10, $15, $20
    photoCount,
    required,
    classified,
    manholes: 1 + (seed % 3), // 1-3 manholes
    hasNotes: seed % 4 === 0,
    photoBonus: status === 'complete' ? 'approved' : 'pending',
    jobQuality: status === 'complete' ? 'correct' : 'pending',
    readyForInvoice: status === 'complete' ? 'yes' : 'pending',
  };
};

// Mock shift data (pre/post forms). Real app pulls from Jobber timesheet.
const generateShifts = () => {
  const shifts = [];
  const now = new Date('2026-05-06');
  REAL_DATA.drivers.slice(0, 5).forEach((d, di) => {
    for (let i = 0; i < 4; i++) {
      const date = new Date(now); date.setDate(now.getDate() - (di * 2 + i));
      const seed = di * 5 + i;
      const preStatus = ['decided', 'pending', 'pending', 'missing'][seed % 4];
      const postStatus = ['decided', 'pending', 'pending', 'pending'][seed % 4];
      shifts.push({
        id: `shift-${d['Full Name'].replace(/\s/g, '')}-${fmtDate(date)}`,
        driver: d['Full Name'],
        date: fmtDate(date),
        bonus: 25,
        pre: {
          submitted: preStatus !== 'missing',
          submittedAt: preStatus !== 'missing' ? `${fmtDate(date)} 8:30 PM` : null,
          decision: preStatus === 'decided' ? 'approved' : null,
          fields: { gasLevel: '3/4', sludge: 1475, valve: 'closed', issue: false },
        },
        post: {
          submitted: postStatus !== 'missing',
          submittedAt: postStatus !== 'missing' ? `${fmtDate(new Date(date.getTime() + 86400000))} 5:30 AM` : null,
          decision: postStatus === 'decided' ? 'approved' : null,
          fields: { gasLevel: '1/4', sludge: 3800, valve: 'closed', issue: false },
        },
      });
    }
  });
  return shifts;
};

const VisitsReview = () => {
  const [view, setView] = useState('queue'); // queue | visit | shift
  const [activeId, setActiveId] = useState(null);
  const [filterStatus, setFilterStatus] = useState('pending');
  const [filterDriver, setFilterDriver] = useState('all');
  const [filterMissing, setFilterMissing] = useState('all');
  const [collapsed, setCollapsed] = useState({ shiftPending: false, visitPending: false, shiftDone: true, visitDone: true });
  const [reviewState, setReviewState] = useState(() => {
    // Build initial review state from completed visits + upcoming visits
    const state = {};
    const allVisits = [
      ...REAL_DATA.schedule.map(s => ({
        id: `visit-${s['Client Code']}-${s['Visit Date'] || s['Date']}`,
        code: s['Client Code'],
        name: s['Client Name'],
        date: s['Visit Date'] || s['Date'],
        truck: s['Truck'],
        driver: s['Driver'],
        photos: [s['Photo 1'], s['Photo 2'], s['Photo 3'], s['Photo 4']].filter(Boolean),
        amount: s['Amount'],
        zone: s['Zone'],
        serviceType: s['Service Type'] || 'Grease Trap Pumping',
      })),
      ...REAL_DATA.upcoming.slice(0, 100).map(u => ({
        id: `visit-${u['Client Code']}-${u['Visit Date']}`,
        code: u['Client Code'],
        name: u['Client Name'],
        date: u['Visit Date'],
        truck: u['Truck'],
        driver: u['Driver'],
        photos: [],
        amount: u['Amount'],
        zone: u['Zone'],
        serviceType: u['Service Type'] || 'Grease Trap Pumping',
      })),
    ];
    allVisits.forEach((v, idx) => {
      state[v.id] = { ...v, ...reviewMock(v, idx) };
    });
    return state;
  });
  const [shifts] = useState(generateShifts);
  const [shiftReviews, setShiftReviews] = useState({}); // shiftId → { preDecision, postDecision }
  const [bulkSelected, setBulkSelected] = useState(new Set());
  const [hoverPhoto, setHoverPhoto] = useState(null);

  // Visits as array
  const visits = Object.values(reviewState);

  // Apply filters
  const filtered = visits.filter(v => {
    if (filterStatus !== 'all' && v.status !== filterStatus) return false;
    if (filterDriver !== 'all' && v.driver !== filterDriver) return false;
    if (filterMissing !== 'all') {
      if (filterMissing === 'photos' && v.photoCount >= v.required) return false;
      if (filterMissing === 'bonus' && v.photoBonus !== 'pending') return false;
      if (filterMissing === 'quality' && v.jobQuality !== 'pending') return false;
      if (filterMissing === 'invoice' && v.readyForInvoice !== 'pending') return false;
    }
    return true;
  });

  // Group by status
  const visitPending = filtered.filter(v => v.status === 'pending');
  const visitFlagged = filtered.filter(v => v.status === 'flagged');
  const visitDone = filtered.filter(v => v.status === 'complete');

  // Shift filtering — driver only
  const filteredShifts = shifts.filter(s => filterDriver === 'all' || s.driver === filterDriver);
  const shiftPending = filteredShifts.filter(s => !shiftReviews[s.id]?.finalized);
  const shiftDone = filteredShifts.filter(s => shiftReviews[s.id]?.finalized);

  // KPIs
  const totalJobs = visits.length;
  const pendingCount = visits.filter(v => v.status === 'pending').length;
  const approvedCount = visits.filter(v => v.status === 'complete').length;
  const flaggedCount = visits.filter(v => v.status === 'flagged').length;
  const totalBonuses = visits.filter(v => v.photoBonus === 'approved').reduce((s, v) => s + v.bonus, 0);

  // Bulk actions
  const bulkApprove = () => {
    setReviewState(prev => {
      const next = { ...prev };
      bulkSelected.forEach(id => {
        if (next[id]) {
          next[id] = { ...next[id], status: 'complete', photoBonus: 'approved', jobQuality: 'correct', readyForInvoice: 'yes' };
        }
      });
      return next;
    });
    setBulkSelected(new Set());
  };

  const toggleBulk = (id) => {
    setBulkSelected(prev => {
      const next = new Set(prev);
      if (next.has(id)) next.delete(id); else next.add(id);
      return next;
    });
  };

  const openVisit = (id) => { setActiveId(id); setView('visit'); };
  const openShift = (id) => { setActiveId(id); setView('shift'); };
  const backToQueue = () => { setActiveId(null); setView('queue'); };

  // Keyboard shortcuts in visit detail
  useEffect(() => {
    if (view !== 'visit') return;
    const onKey = (e) => {
      if (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA') return;
      if (e.key === 'Escape') backToQueue();
      if (e.key === 'j' || e.key === 'J') {
        const idx = visitPending.findIndex(v => v.id === activeId);
        if (idx < visitPending.length - 1) setActiveId(visitPending[idx + 1].id);
      }
      if (e.key === 'k' || e.key === 'K') {
        const idx = visitPending.findIndex(v => v.id === activeId);
        if (idx > 0) setActiveId(visitPending[idx - 1].id);
      }
    };
    window.addEventListener('keydown', onKey);
    return () => window.removeEventListener('keydown', onKey);
  }, [view, activeId, visitPending]);

  // ===== QUEUE VIEW =====
  if (view === 'queue') {
    return (
      <div>
        {/* Compact header */}
        <div className="flex items-center justify-between mb-5">
          <div>
            <div className="flex items-center gap-2.5">
              <div className="w-1 h-6 rounded-full bg-brand"></div>
              <h1 className="text-xl font-bold text-gray-900 tracking-tight">Visits review</h1>
              <Badge tone="brand">Daily review queue</Badge>
            </div>
            <div className="text-xs text-gray-500 mt-1.5 ml-3.5">May 7, 2026 · payroll week ending Fri May 8</div>
          </div>
        </div>

        {/* KPIs — using shared KPI component */}
        <div className="grid grid-cols-5 gap-4 mb-5">
          <KPI icon="📋" label="Total jobs" value={totalJobs} tone="blue" />
          <KPI icon="⏰" label="Pending review" value={pendingCount} tone="yellow" />
          <KPI icon="✓" label="Approved" value={approvedCount} tone="green" />
          <KPI icon="🚩" label="Flagged" value={flaggedCount} tone="red" />
          <KPI icon="$" label="Total bonuses" value={fmt$(totalBonuses)} tone="orange" />
        </div>

        {/* Filters */}
        <Card className="p-4 mb-4">
          <div className="grid grid-cols-5 gap-3">
            <div>
              <label className="text-[10px] uppercase tracking-wider text-gray-500 font-bold block mb-1">Payroll Week</label>
              <select className="w-full px-3 py-1.5 border border-gray-300 rounded-lg text-sm">
                <option>All weeks</option>
                <option>This week · Fri May 1 - Fri May 8</option>
                <option>Last week · Fri Apr 24 - Fri May 1</option>
              </select>
            </div>
            <div>
              <label className="text-[10px] uppercase tracking-wider text-gray-500 font-bold block mb-1">Driver</label>
              <select value={filterDriver} onChange={e => setFilterDriver(e.target.value)} className="w-full px-3 py-1.5 border border-gray-300 rounded-lg text-sm">
                <option value="all">All drivers</option>
                {REAL_DATA.drivers.map(d => <option key={d['Full Name']} value={d['Full Name']}>{d['Full Name']}</option>)}
              </select>
            </div>
            <div>
              <label className="text-[10px] uppercase tracking-wider text-gray-500 font-bold block mb-1">Status</label>
              <select value={filterStatus} onChange={e => setFilterStatus(e.target.value)} className="w-full px-3 py-1.5 border border-gray-300 rounded-lg text-sm">
                <option value="all">All</option>
                <option value="pending">Pending</option>
                <option value="complete">Approved</option>
                <option value="flagged">Flagged</option>
              </select>
            </div>
            <div>
              <label className="text-[10px] uppercase tracking-wider text-gray-500 font-bold block mb-1">Filter by Missing</label>
              <select value={filterMissing} onChange={e => setFilterMissing(e.target.value)} className="w-full px-3 py-1.5 border border-gray-300 rounded-lg text-sm">
                <option value="all">All items</option>

        {/* SHIFT FORMS PENDING REVIEW */}
        <SectionCollapse
          title={`Shift Forms Pending Review (${shiftPending.length} shifts)`}

              <VisitCard key={v.id} visit={v} onClick={() => openVisit(v.id)} done />
            ))}
            {visitDone.length === 0 && <div className="text-xs text-gray-400 italic text-center py-4">No completed visit reviews yet</div>}
          </div>
        </SectionCollapse>

        {/* Hover photo preview */}
        {hoverPhoto && (
          <div className="fixed top-1/4 right-8 z-50 pointer-events-none">
            <div className="w-64 h-64 bg-white rounded-lg shadow-2xl border border-gray-200 overflow-hidden">
              <img src={hoverPhoto} alt="" className="w-full h-full object-cover" />
            </div>
          </div>
        )}
      </div>
    );
  }

  // ===== VISIT DETAIL VIEW =====
  if (view === 'visit') {
    const v = reviewState[activeId];
    if (!v) { backToQueue(); return null; }
    const idx = visitPending.findIndex(x => x.id === activeId);
    return <VisitDetail
      visit={v}
      currentIdx={idx}
      total={visitPending.length}
      onBack={backToQueue}
      onPrev={() => idx > 0 && setActiveId(visitPending[idx - 1].id)}
      onNext={() => idx < visitPending.length - 1 && setActiveId(visitPending[idx + 1].id)}
      onUpdate={(patch) => setReviewState(prev => ({ ...prev, [activeId]: { ...prev[activeId], ...patch } }))}
    />;
  }

  // ===== SHIFT DETAIL VIEW =====
  if (view === 'shift') {
    const s = shifts.find(x => x.id === activeId);
    if (!s) { backToQueue(); return null; }
    return <ShiftDetail
      shift={s}
      review={shiftReviews[activeId] || {}}
      onBack={backToQueue}
      onUpdate={(patch) => setShiftReviews(prev => ({ ...prev, [activeId]: { ...prev[activeId], ...patch } }))}
    />;
  }

  return null;
};

// ----- SectionCollapse -----
const SectionCollapse = ({ title, tone, collapsed, onToggle, children }) => {
  const dotColor = tone === 'amber' ? 'bg-amber-400' : 'bg-emerald-400';
  return (
    <div className="mb-5">
      <button
        onClick={onToggle}
        className="w-full flex items-center justify-between px-4 py-3 rounded-xl border border-gray-200 bg-white hover:bg-gray-50 transition mb-3"
      >
        <span className="flex items-center gap-2.5">
          <span className={`w-2 h-2 rounded-full ${dotColor}`}></span>
          <span className="text-xs font-bold tracking-wider uppercase text-gray-700">{title}</span>
        </span>
        <span className="text-gray-400 text-sm">{collapsed ? '▾' : '▴'}</span>
      </button>
      {!collapsed && children}
    </div>
  );
};

const ShiftFormCard = ({ title, submittedAt, fields, decision, onApprove, onReject }) => {
  const [verified, setVerified] = useState({});
  const allFields = [
    { key: 'submitted', label: 'Submitted', value: submittedAt || '—' },
    { key: 'driver', label: 'Driver', value: 'Steven' },
    { key: 'truck', label: 'Truck', value: fields?.truck || '—' },
    { key: 'gas', label: 'Gas Level', value: fields?.gasLevel || '—' },
    { key: 'sludge', label: 'Sludge Gallons', value: fields?.sludge || '—' },
    { key: 'valve', label: 'Valve Closed', value: fields?.valve || '—' },
    { key: 'issue', label: 'Issue Reported', value: fields?.issue ? 'Yes' : 'No' },
  ];
  const verifiedCount = Object.values(verified).filter(Boolean).length;
  const checkAll = () => setVerified(allFields.reduce((acc, f) => ({ ...acc, [f.key]: true }), {}));
  const uncheckAll = () => setVerified({});

  return (
    <Card className="p-5 mb-4">
      <div className="flex items-center justify-between mb-3">
        <div className="flex items-center gap-2">
          {decision === 'approved' && <span className="text-emerald-500">✓</span>}
          {decision === 'rejected' && <span className="text-red-500">✗</span>}
          {!decision && <span className="text-gray-400">🕐</span>}
          <span className="font-bold">{title}</span>
        </div>
        <span className="text-xs text-gray-500">🕐 Submitted at {submittedAt || '—'}</span>
      </div>
      <div className="flex items-center justify-between mb-3">
        <span className="text-[10px] uppercase tracking-wider text-gray-500 font-bold">Form Fields ({verifiedCount}/{allFields.length} verified)</span>
        <button onClick={verifiedCount === allFields.length ? uncheckAll : checkAll} className="text-xs text-brand-dark hover:underline">
          {verifiedCount === allFields.length ? 'Uncheck All' : 'Check All'}
        </button>
      </div>
      <div className="grid grid-cols-2 gap-2 mb-4">
        {allFields.map(f => (
          <label
            key={f.key}
            className={`flex items-start gap-2 p-2.5 border rounded-lg cursor-pointer transition ${verified[f.key] ? 'bg-emerald-50 border-emerald-300' : 'bg-white border-gray-200 hover:bg-gray-50'}`}
          >
            <input
              type="checkbox"
              checked={!!verified[f.key]}
              onChange={() => setVerified(prev => ({ ...prev, [f.key]: !prev[f.key] }))}
              className="mt-0.5 w-4 h-4 accent-emerald-500"
            />
            <div>
              <div className="text-[10px] text-gray-500 uppercase tracking-wider">{f.label}</div>
              <div className="text-sm font-medium">{f.value}</div>
            </div>
          </label>
        ))}
      </div>
      <div className="text-[10px] uppercase tracking-wider text-gray-500 font-bold mb-2">Form Review Decision</div>
      <div className="grid grid-cols-2 gap-3">
        <button
          onClick={onApprove}
          className={`flex items-center gap-3 p-3 rounded-lg border-2 transition ${decision === 'approved' ? 'bg-emerald-50 border-emerald-400' : 'border-gray-200 hover:border-emerald-300'}`}
        >
          <div className="w-9 h-9 rounded-full bg-emerald-100 text-emerald-600 flex items-center justify-center">✓</div>
          <div className="text-left">
            <div className="text-sm font-semibold">Approve This Form</div>
            <div className="text-xs text-gray-500">Form is complete and correct</div>
          </div>
          {decision === 'approved' && <Badge tone="brand">Selected</Badge>}
        </button>
        <button
          onClick={onReject}
          className={`flex items-center gap-3 p-3 rounded-lg border-2 transition ${decision === 'rejected' ? 'bg-red-50 border-red-400' : 'border-gray-200 hover:border-red-300'}`}
        >
          <div className="w-9 h-9 rounded-full bg-red-100 text-red-600 flex items-center justify-center">✗</div>
          <div className="text-left">
            <div className="text-sm font-semibold">Reject This Form</div>
            <div className="text-xs text-gray-500">Issues need to be addressed</div>
          </div>
          {decision === 'rejected' && <Badge tone="red">Selected</Badge>}
        </button>
      </div>
      {decision === 'rejected' && (
        <textarea
          placeholder="Explain why this form is being rejected..."
          className="w-full mt-3 px-3 py-2 border border-gray-300 rounded-lg text-sm"
          rows={3}
        />
      )}
    </Card>
  );
};
