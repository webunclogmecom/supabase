name: Weekly drift audit (AT vs Sbx)

# ───────────────────────────────────────────────────────────────────────────
# Sundays at 13:30 UTC = 09:30 ET (EDT) / 08:30 ET (EST). Quiet weekend slot
# so the AUDIT-mode runs don't compete with weekday cron activity.
#
# This workflow runs every audit in AUDIT-ONLY mode (no writes). If anything
# drifts, the workflow flags it in the Actions UI. Fred reviews + decides
# whether to re-run locally with --execute to sync.
# ───────────────────────────────────────────────────────────────────────────

on:
  schedule:
    - cron: '30 13 * * 0'
  workflow_dispatch:

concurrency:
  group: weekly-drift-audit
  cancel-in-progress: false

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - run: npm ci --ignore-scripts || npm i --ignore-scripts

      - name: Full client + property + service_config drift vs AT
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          SUPABASE_PAT: ${{ secrets.SUPABASE_PAT }}
          SUPABASE_PROJECT_ID: ${{ secrets.SUPABASE_PROJECT_ID }}
          AIRTABLE_API_KEY: ${{ secrets.AIRTABLE_API_KEY }}
          AIRTABLE_BASE_ID: ${{ secrets.AIRTABLE_BASE_ID }}
        run: node scripts/probes/audit_clients_full_vs_at.js

      - name: service_configs vs AT Service Type (subscription truth)
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          SUPABASE_PAT: ${{ secrets.SUPABASE_PAT }}
          SUPABASE_PROJECT_ID: ${{ secrets.SUPABASE_PROJECT_ID }}
          AIRTABLE_API_KEY: ${{ secrets.AIRTABLE_API_KEY }}
          AIRTABLE_BASE_ID: ${{ secrets.AIRTABLE_BASE_ID }}
        run: node scripts/probes/audit_service_configs_vs_at.js

      - name: client status vs AT
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          SUPABASE_PAT: ${{ secrets.SUPABASE_PAT }}
          SUPABASE_PROJECT_ID: ${{ secrets.SUPABASE_PROJECT_ID }}
          AIRTABLE_API_KEY: ${{ secrets.AIRTABLE_API_KEY }}
          AIRTABLE_BASE_ID: ${{ secrets.AIRTABLE_BASE_ID }}
        run: node scripts/probes/audit_client_status_vs_at.js
