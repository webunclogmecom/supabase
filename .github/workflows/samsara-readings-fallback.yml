name: Samsara tank readings (fallback)

# The tank readings job's FALLBACK RUNNER (2026-10-16, Fred: "a fallback or restart system for this cases, because we
# also use this data"). The real runner is the Railway service samsara-readings (UnclogMe Timed Jobs, every 5 minutes,
# sync_log source railway_samsara_readings). Press "Run workflow" here when the samsara-feed-health alert says that
# service is not storing readings and Railway cannot be fixed quickly: the job catches up from the last good Railway
# run, and duplicates are skipped, so running it while Railway also runs is safe.
# It logs under sync_log source github_samsara_readings: it never moves the Railway cursor (Railway re-fetches the same
# window when it comes back, at no cost) and never hides a dead Railway service from the watchdog, but the jobs that
# wait for complete readings (stop builder, the grease freeze) accept its runs.
# No schedule on purpose: GitHub schedules here run every 4 to 8 hours whatever the cron says (measured since 2026-08-27).
on:
  workflow_dispatch:

concurrency:
  group: samsara-readings-fallback
  cancel-in-progress: false

jobs:
  poll:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '20' }
      - run: npm ci --no-audit --no-fund 2>/dev/null || npm install --no-audit --no-fund
      - name: Run the tank readings job
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          SAMSARA_API_TOKEN: ${{ secrets.SAMSARA_API_TOKEN }}
          RUN_TIMEOUT_MIN: '25'
        run: node scripts/sync/run_logged.js github_samsara_readings scripts/sync/cron_samsara_tank_readings.js
