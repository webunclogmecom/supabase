name: Jobber token keepalive

# Proactively refresh BOTH Jobber OAuth tokens (read app source_system='jobber' +
# Calendar write app 'jobber_write') every 30 min. Keeps the short-lived access
# tokens always fresh AND turns a dead/invalid refresh_token into an immediately
# visible failed run (alert) instead of a silent 500 inside a sync.
#
# Both apps have refresh-token rotation OFF, so the refresh_token is permanent —
# this should never fail. If it does, re-authorize that app once
# (docs/jobber-write-oauth-setup.md) and the chain is durable again.
#
# Only needs SUPABASE_URL + SUPABASE_PAT (refreshes via the Jobber OAuth endpoint
# and stores into public.webhook_tokens via the management API).

on:
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:

concurrency:
  group: jobber-token-keepalive
  cancel-in-progress: false

jobs:
  keepalive:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install dependencies
        run: npm ci --omit=dev || npm install --omit=dev
      - name: Refresh Jobber tokens
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_PAT: ${{ secrets.SUPABASE_PAT }}
        run: node scripts/sync/jobber_token_keepalive.js
