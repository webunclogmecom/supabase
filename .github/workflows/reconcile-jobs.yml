name: Jobs reconcile (manual fallback — schedule RETIRED 2026-07-30)

# ⚠ SCHEDULE RETIRED 2026-07-30: superseded by the edge fn `sync-jobber-job-drift`
# on pg_cron every 30 minutes (15,45 * * * *, via fn_request_jobber_sync('jobs-drift')).
# Fred asked for a 30-minute sync check on jobs; GitHub throttles sub-hourly crons
# unreliably (the */2 poll ran at ~2-3h intervals before it was moved to pg_cron),
# and two scheduled reconcilers would be two writers wiping/reinserting the same
# line items. The edge fn also fixes this workflow's stale-archive blind spot
# (jobs archived in the DB could never self-heal) and batches its Jobber reads.
# This file is kept as a MANUAL fallback (workflow_dispatch) only — same script,
# useful when the edge runtime is down or for a --dry-run comparison.
#
# Historical context (why a full by-GID reconcile exists at all): Jobber's
# JobFilterAttributes accepts ONLY `createdAt` (NOT `updatedAt`), so the */5 delta
# poll can never re-fetch an OLD job that was edited. See reference_jobs_sync_gaps +
# docs/jobber-calendar-job-migration/jobs-visits-calendar-workflow.md.

on:
  workflow_dispatch:
    inputs:
      execute:
        description: 'Apply updates? (true = execute, false = dry-run)'
        required: false
        default: 'true'

concurrency:
  group: jobs-reconcile
  cancel-in-progress: false

jobs:
  reconcile:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm ci --omit=dev || npm install --omit=dev

      - name: Reconcile jobs against Jobber
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          SUPABASE_PAT: ${{ secrets.SUPABASE_PAT }}
          SUPABASE_PROJECT_ID: ${{ secrets.SUPABASE_PROJECT_ID }}
          JOBBER_CLIENT_ID: ${{ secrets.JOBBER_CLIENT_ID }}
          JOBBER_CLIENT_SECRET: ${{ secrets.JOBBER_CLIENT_SECRET }}
        run: |
          if [ "${{ github.event.inputs.execute || 'true' }}" = "true" ]; then
            node scripts/sync/reconcile_jobs.js --execute
          else
            node scripts/sync/reconcile_jobs.js
          fi
