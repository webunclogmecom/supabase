name: Jobs reconcile every 6h (status + frequency + line items)

# Closes the jobs-sync gaps the createdAt-cursored poll can't: existing-job status changes
# (archive/complete), the Frequency custom field, job line items (SA-has / SC-has-none rule),
# and deletions (Jobber returns null -> mark archived). Runs scripts/sync/reconcile_jobs.js
# over all non-archived jobs (~475, ~4 min/run).
#
# WHY this is the only catch-up for EDITED jobs: Jobber's JobFilterAttributes accepts ONLY
# `createdAt` (NOT `updatedAt`), so the */5 delta poll can incrementally fetch NEW jobs but can
# never re-fetch an OLD job that was edited (e.g. a Frequency or line-item change). handleJob
# (the per-job webhook path) re-fetches fresh from Jobber, but it only fires for jobs the poll
# actually pulls. So an edit to an old job propagates ONLY when this full by-GID reconcile runs.
# Bumped daily -> every 6h (2026-06-30) to shrink that edit-sync latency from 24h to <=6h
# (031-KRU's stale Frequency was the trigger). See reference_jobs_sync_gaps +
# docs/jobber-calendar-job-migration/jobs-visits-calendar-workflow.md.

on:
  schedule:
    - cron: '0 */6 * * *'   # every 6 hours (00/06/12/18 UTC)
  workflow_dispatch:
    inputs:
      execute:
        description: 'Apply updates? (true = execute, false = dry-run)'
        required: false
        default: 'true'

concurrency:
  group: jobs-reconcile
  cancel-in-progress: false

jobs:
  reconcile:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm ci --omit=dev || npm install --omit=dev

      - name: Reconcile jobs against Jobber
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          SUPABASE_PAT: ${{ secrets.SUPABASE_PAT }}
          SUPABASE_PROJECT_ID: ${{ secrets.SUPABASE_PROJECT_ID }}
          JOBBER_CLIENT_ID: ${{ secrets.JOBBER_CLIENT_ID }}
          JOBBER_CLIENT_SECRET: ${{ secrets.JOBBER_CLIENT_SECRET }}
        run: |
          if [ "${{ github.event.inputs.execute || 'true' }}" = "true" ]; then
            node scripts/sync/reconcile_jobs.js --execute
          else
            node scripts/sync/reconcile_jobs.js
          fi
