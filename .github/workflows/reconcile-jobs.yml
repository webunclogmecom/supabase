name: Daily jobs reconcile (status + frequency + line items)

# Closes the jobs-sync gaps the createdAt-cursored poll can't: existing-job status changes
# (archive/complete), the Frequency custom field, job line items (SA-has / SC-has-none rule),
# and deletions (Jobber returns null -> mark archived). Runs scripts/sync/reconcile_jobs.js
# once a day over all non-archived jobs. The real-time path is webhook-jobber.handleJob; this is
# the daily catch-up. See reference_jobs_sync_gaps + docs/jobber-calendar-job-migration/jobs-visits-calendar-workflow.md.

on:
  schedule:
    - cron: '0 9 * * *'   # 09:00 UTC daily
  workflow_dispatch:
    inputs:
      execute:
        description: 'Apply updates? (true = execute, false = dry-run)'
        required: false
        default: 'true'

concurrency:
  group: jobs-reconcile
  cancel-in-progress: false

jobs:
  reconcile:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm ci --omit=dev || npm install --omit=dev

      - name: Reconcile jobs against Jobber
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          SUPABASE_PAT: ${{ secrets.SUPABASE_PAT }}
          SUPABASE_PROJECT_ID: ${{ secrets.SUPABASE_PROJECT_ID }}
          JOBBER_CLIENT_ID: ${{ secrets.JOBBER_CLIENT_ID }}
          JOBBER_CLIENT_SECRET: ${{ secrets.JOBBER_CLIENT_SECRET }}
        run: |
          if [ "${{ github.event.inputs.execute || 'true' }}" = "true" ]; then
            node scripts/sync/reconcile_jobs.js --execute
          else
            node scripts/sync/reconcile_jobs.js
          fi
