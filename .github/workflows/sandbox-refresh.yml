name: Sandbox refresh (Production → Sandbox data sync)

# ============================================================================
# ⚰️ RETIRED 2026-06-11 — Sandbox #1 (ubtlwpcyntelgbykdatn) was DELETED.
# Verified before deletion: 0 API requests in 7 days, no Lovable app references
# (all apps on Prod or Lovable Cloud), review data migrated to Prod canonical
# 2026-06-08. Final backup of its unique tables (app_visit_reviews,
# app_shift_reviews, app_property_overrides): ..\..\backups\
# sandbox1_final_backup_2026-06-11.json (parent folder, outside this repo).
# Schedule removed + workflow disabled — running it now would just fail.
# ============================================================================

# 5×/day on a 3-hour cadence, all expressed in UTC (DST not handled — these
# times shift by 1 hour between EDT and EST):
#   11:00 UTC = 07:00 EDT / 06:00 EST   ← anchor; after overnight shift completes
#   14:00 UTC = 10:00 EDT / 09:00 EST
#   17:00 UTC = 13:00 EDT / 12:00 EST
#   20:00 UTC = 16:00 EDT / 15:00 EST
#   23:00 UTC = 19:00 EDT / 18:00 EST
#
# Max Sandbox staleness: ~3h during business hours, ~12h overnight.
#
# Each refresh runs AFTER:
#   - 09:00 UTC daily-cleanup workflow finishes (for the 11:00 UTC run)
#   - Any pending Jobber/Samsara/Airtable webhook activity has settled
#
# Refreshes Production-owned canonical tables INTO Sandbox, leaving Yannick's
# app-specific tables/columns alone. Each refresh briefly TRUNCATEs canonical
# tables for ~5-10 min — Lovable queries on those tables can block during
# that window. The concurrency guard below ensures runs serialize if one
# overruns into the next slot.
#
# See scripts/sync/sandbox_refresh.sh for the full story.

on:
  # schedule removed 2026-06-11 (target project deleted):
  #   was: 0 11/14/17/20/23 * * * (5×/day)
  workflow_dispatch:  # kept only so the workflow file stays valid; target is gone

concurrency:
  group: sandbox-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Install postgresql-client-17 (matches Supabase PG 17)
        run: |
          sudo sh -c 'echo "deb http://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" > /etc/apt/sources.list.d/pgdg.list'
          curl -fsSL https://www.postgresql.org/media/keys/ACCC4CF8.asc | sudo gpg --dearmor -o /etc/apt/trusted.gpg.d/postgresql.gpg
          sudo apt-get update -qq
          sudo apt-get install -y -qq postgresql-client-17
          # Make sure the v17 binaries take precedence over any older system-default
          export PATH="/usr/lib/postgresql/17/bin:$PATH"
          echo "/usr/lib/postgresql/17/bin" >> $GITHUB_PATH
          which pg_dump
          pg_dump --version

      - name: Run refresh
        env:
          PROD_DB_URL: ${{ secrets.PROD_DB_URL }}
          SANDBOX_DB_URL: ${{ secrets.SANDBOX_DB_URL }}
        run: bash scripts/sync/sandbox_refresh.sh
