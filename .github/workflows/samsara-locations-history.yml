name: Samsara GPS (fallback)

# The GPS job's FALLBACK RUNNER (2026-10-16, Fred: "a fallback or restart system for this cases, because we also use
# this data"). The real runner is the Railway service samsara-gps (UnclogMe Timed Jobs, every 5 minutes, sync_log
# source railway_samsara_gps). Press "Run workflow" here when the samsara-feed-health alert says that service is not
# storing GPS and Railway cannot be fixed quickly: the job catches up from the newest stored GPS point (up to 7 days
# back), and duplicates are skipped, so running it while Railway also runs is safe.
# It logs under sync_log source github_samsara_gps, so it never hides a dead Railway service from the watchdog, but
# the jobs that wait for complete GPS (stop builder, time on site, the grease freeze) accept its runs.
# Manual backfill: fill start_time (and end_time) to re-pull an exact window (a dropped span, a hole).
# No schedule on purpose: GitHub schedules here run every 4 to 8 hours whatever the cron says (measured since 2026-08-27).
on:
  workflow_dispatch:
    inputs:
      start_time:
        description: 'Backfill only: start (ISO 8601 UTC, e.g. 2026-10-01T00:00:00Z), at or before the start of the gap. Leave both blank to catch up from the last stored point.'
        required: false
        type: string
      end_time:
        description: 'Backfill only, needs start_time: end (ISO 8601 UTC). Leave blank for now.'
        required: false
        type: string

concurrency:
  group: samsara-locations-history
  cancel-in-progress: false

jobs:
  poll:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '20' }
      - run: npm ci --no-audit --no-fund 2>/dev/null || npm install --no-audit --no-fund
      - name: Run the GPS job
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          SAMSARA_API_TOKEN: ${{ secrets.SAMSARA_API_TOKEN }}
          START_TIME: ${{ inputs.start_time }}
          END_TIME: ${{ inputs.end_time }}
          RUN_TIMEOUT_MIN: '25'
        run: node scripts/sync/run_logged.js github_samsara_gps scripts/sync/cron_samsara_locations_history.js
