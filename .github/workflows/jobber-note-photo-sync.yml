name: Jobber note-photo diff sync (manual fallback; runs hourly on Railway)

# Keeps each recent completed visit's photos in sync with the CURRENT attachments
# on its Jobber notes — the ADD half catches photos Diego adds to an existing note
# LATER (the daily migration is note-level idempotent and skips edited notes, so it
# misses these). Photo-level diff via entity_source_links attachment GID.
#
# Ran every 6h on GitHub from 2026-07-01 (Fred). Full sync (add + remove). REMOVE is now safe:
# it is NOTE-ANCHORED (only unlinks a JOB-note photo whose own note is still on the
# visit but dropped the attachment) and UNLINK-based (keeps the photos row + storage,
# recoverable) — never the old naive visit-diff hard-delete. ADD is dedup-safe (links
# an existing photo by attachment gid instead of re-downloading) and JOB-note only
# (client notes are client-level and repeat on every visit → would over-attach).
# The script self-refreshes the Jobber read token from webhook_tokens, so no static
# JOBBER_ACCESS_TOKEN secret is needed.

# 🛑 NO SCHEDULE SINCE 2026-11-24 (Trello #247). GitHub delivered about a quarter of the hourly runs; on 11-24 none
# came for 10 hours and three visits of the Nov 23 route had no photos in Admin Review. The sync runs hourly at :05 on Railway
# (service note-photo, services/timed-jobs/services.json; 14 days at 05 UTC, else 3). This button is the fallback:
# "Run workflow" with days 3 brings a late visit in within a minute.
on:
  workflow_dispatch:
    inputs:
      days:
        description: 'Look-back window (days)'
        default: '3'

concurrency:
  group: jobber-note-photo-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '20' }
      - run: npm install
      - name: Photo-level diff sync from Jobber notes (add + note-anchored remove)
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: node scripts/sync/sync_jobber_note_photos.js --execute --enable-remove --days=${{ github.event.inputs.days || '3' }}
