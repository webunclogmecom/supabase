name: Jobber note-photo diff sync (every 6h)

# Keeps each recent completed visit's photos in sync with the CURRENT attachments
# on its Jobber notes — the ADD half catches photos Diego adds to an existing note
# LATER (the daily migration is note-level idempotent and skips edited notes, so it
# misses these). Photo-level diff via entity_source_links attachment GID.
#
# Runs every 6h (Fred, 2026-07-01). Add-only for now — REMOVE is gated behind
# --enable-remove until the delete path is verified safe (a naive diff can
# false-positive on a partial/empty Jobber response and hard-delete is irreversible).
# The script self-refreshes the Jobber read token from webhook_tokens, so no static
# JOBBER_ACCESS_TOKEN secret is needed.

on:
  schedule:
    - cron: '0 */6 * * *'   # 00:00 / 06:00 / 12:00 / 18:00 UTC
  workflow_dispatch:
    inputs:
      days:
        description: 'Look-back window (days)'
        default: '14'

concurrency:
  group: jobber-note-photo-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '20' }
      - run: npm install
      - name: Photo-level diff sync from Jobber notes (add-only)
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_PROJECT_ID: ${{ secrets.SUPABASE_PROJECT_ID }}
          SUPABASE_PAT: ${{ secrets.SUPABASE_PAT }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: node scripts/sync/sync_jobber_note_photos.js --execute --days=${{ github.event.inputs.days || '14' }}
