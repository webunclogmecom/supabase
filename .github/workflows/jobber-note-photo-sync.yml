name: Jobber note-photo diff sync (every 6h)

# Keeps each recent completed visit's photos in sync with the CURRENT attachments
# on its Jobber notes — the ADD half catches photos Diego adds to an existing note
# LATER (the daily migration is note-level idempotent and skips edited notes, so it
# misses these). Photo-level diff via entity_source_links attachment GID.
#
# Runs every 6h (Fred, 2026-07-01). Full sync (add + remove). REMOVE is now safe:
# it is NOTE-ANCHORED (only unlinks a JOB-note photo whose own note is still on the
# visit but dropped the attachment) and UNLINK-based (keeps the photos row + storage,
# recoverable) — never the old naive visit-diff hard-delete. ADD is dedup-safe (links
# an existing photo by attachment gid instead of re-downloading) and JOB-note only
# (client notes are client-level and repeat on every visit → would over-attach).
# The script self-refreshes the Jobber read token from webhook_tokens, so no static
# JOBBER_ACCESS_TOKEN secret is needed.

on:
  schedule:
    - cron: '0 */6 * * *'   # 00:00 / 06:00 / 12:00 / 18:00 UTC — full 14d sweep
    # HOT-WINDOW sweep (2026-08-18, from the August photo audit): photos posted between the
    # 6h runs were invisible for up to 6h, which is exactly what Yannick hit on visit 6537.
    # Hourly at :30 (offset so it never fires the same minute as the 6h run), --days=3 only
    # (~20 completed visits/run — measured — so the Jobber cost is a fraction of the full
    # sweep's). The shared concurrency group makes overlapping runs QUEUE, not collide.
    # ⚠ A scheduled run CANNOT read workflow_dispatch inputs — days must branch on
    # github.event.schedule below, or the hourly run silently does the full 14d sweep
    # 24 times a day (the adversarial review caught this before it shipped).
    - cron: '30 * * * *'
  workflow_dispatch:
    inputs:
      days:
        description: 'Look-back window (days)'
        default: '14'

concurrency:
  group: jobber-note-photo-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '20' }
      - run: npm install
      - name: Photo-level diff sync from Jobber notes (add + note-anchored remove)
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_PROJECT_ID: ${{ secrets.SUPABASE_PROJECT_ID }}
          SUPABASE_PAT: ${{ secrets.SUPABASE_PAT }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: node scripts/sync/sync_jobber_note_photos.js --execute --enable-remove --days=${{ github.event.schedule == '30 * * * *' && '3' || github.event.inputs.days || '14' }}
