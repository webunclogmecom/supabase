# Hourly refresh of the "Client App Mirror" Supabase project (mjxjhwxktedrrnochwli)
# from Prod. Yannick builds the Client App against the mirror; see
# docs/reference/client-app-mirror.md for the full design (audited 2026-07-08).
# Prod access is READ-ONLY. Triggers are schedule + manual only — never add
# pull_request/pull_request_target here (public repo, secrets in play).
name: client-mirror-refresh

on:
  schedule:
    - cron: '23 * * * *'
  workflow_dispatch:

concurrency:
  group: client-mirror-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Refresh client mirror from Prod
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          SUPABASE_PAT: ${{ secrets.SUPABASE_PAT }}
          SUPABASE_PROJECT_ID: wbasvhvvismukaqdnouk
          CLIENT_MIRROR_URL: ${{ secrets.CLIENT_MIRROR_URL }}
          CLIENT_MIRROR_SECRET_KEY: ${{ secrets.CLIENT_MIRROR_SECRET_KEY }}
        run: node scripts/sync/refresh_client_mirror.js
