name: SA visit generation (DB + Jobber schedule)

# ============================================================================
# Generates Service Agreement visits from jobs.frequency_days and inserts them
# with source='supabase_cron'. The DB trigger trg_push_visit_insert then pushes
# each visit to Jobber's schedule via the jobber-push-visit Edge Function
# (visitCreate on the job's GID, link written back to entity_source_links).
#
# END-TO-END SMOKE-TESTED 2026-06-11 on 112-YA (client_id 381):
#   generate -> insert -> trigger -> push -> Jobber visit created (verified via
#   Jobber API) -> soft-delete -> push delete -> gone from Jobber. Clean.
#
# ✅ ACTIVATED 2026-06-24 — daily schedule live (06:00 ET). Go-live checklist (all done):
#   1. ✅ New SA jobs exist in Jobber with the Frequency custom field (171 active SA jobs;
#         public.jobs.frequency_days synced by the jobs poll / fetch_service_agreement_jobs.js).
#   2. ✅ Push triggers widened off the 112-YA test gate to all clients
#         (migration 2026-06-23_widen_jobber_push_all_clients.sql).
#   3. ✅ Schedule uncommented below.
#   4. ✅ Backfilled 2026-06-24: 676 SA cron visits across 143 clients, 100% pushed +
#         GID-linked to Jobber, 0 orphans (ops.v_calendar_push_health clean).
# Horizon: --horizon-months=6 (rolling). The daily run keeps each SA job's chain extended
# to ~6 months and is idempotent (±7d job-scoped dedup); jobber-push-visit retries on
# Jobber throttle. See docs/service-agreement-visit-generation.md.
# ============================================================================

on:
  schedule:
    - cron: '0 10 * * *'   # daily 06:00 EDT / 05:00 EST — after overnight shift
  workflow_dispatch:
    inputs:
      execute:
        description: 'Actually write (true) or dry-run (false)'
        required: true
        default: 'false'
      client:
        description: 'Limit to one client_code (empty = --all)'
        required: false
        default: ''

concurrency:
  group: sa-visit-generation
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - name: Generate SA visits (+ auto-push to Jobber via DB trigger)
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          SUPABASE_PROJECT_ID: wbasvhvvismukaqdnouk
          SUPABASE_PAT: ${{ secrets.SUPABASE_PAT }}
        run: |
          ARGS=""
          if [ "${{ github.event.inputs.client }}" != "" ]; then ARGS="--client=${{ github.event.inputs.client }}"; else ARGS="--all"; fi
          if [ "${{ github.event_name }}" = "schedule" ] || [ "${{ github.event.inputs.execute }}" = "true" ]; then ARGS="$ARGS --execute"; fi
          node scripts/sync/generate_service_agreement_visits.js $ARGS --horizon-months=6
