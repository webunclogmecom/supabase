name: Apply Prod schema → Field Portal Sandbox

# ─────────────────────────────────────────────────────────────────────────
# Two-phase seed for Field Portal Sandbox (klgtrdwrasrlxbmfyvdh).
#
# Phase 1 (this workflow): Apply Prod's `public` schema to Field Portal.
#   - Uses Docker postgres:17 to avoid pg_dump version-mismatch errors
#     (GH runners ship pg-client 16 by default; Prod is on pg 17.6).
#   - Schema only — no data. Data is handled by the Node subset script.
#
# Phase 2 (separate, not in this workflow):
#   node scripts/sync/subset_prod_to_field_portal.js
#   Picks ~30% of ACTIVE/RECURRING clients with visit history and copies
#   them + related rows (properties, visits, invoices, etc.) for testing.
#
# Why split: schema clone is fast + safe; data subset needs careful
# FK ordering and filtering and is better expressed in Node.
#
# GitHub Secrets needed:
#   PROD_DB_URL              already set
#   FIELD_PORTAL_DB_URL      already set (2026-05-14)
# ─────────────────────────────────────────────────────────────────────────

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type "APPLY" to confirm. This drops + recreates Field Portal `public` schema.'
        required: true
        type: string

concurrency:
  group: apply-schema-to-field-portal
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    if: ${{ inputs.confirm == 'APPLY' }}
    steps:
      - uses: actions/checkout@v4

      - name: Pull postgres:17 image
        run: docker pull postgres:17

      - name: Dump Prod public schema (and strip CREATE SCHEMA so it's idempotent)
        env:
          PROD_DB_URL: ${{ secrets.PROD_DB_URL }}
        run: |
          set -o pipefail
          docker run --rm postgres:17 pg_dump \
            --schema-only --no-owner --no-privileges --schema=public \
            "$PROD_DB_URL" > schema_raw.sql
          # pg_dump 17 emits "CREATE SCHEMA public;" and an associated COMMENT.
          # Field Portal already has the public schema (Supabase pre-creates it
          # after our DROP+CREATE step), so these lines fail with "already
          # exists". Strip them.
          sed -e '/^CREATE SCHEMA public;$/d' \
              -e '/^COMMENT ON SCHEMA public IS/d' \
              -e '/^\\restrict /d' \
              -e '/^\\unrestrict /d' \
              schema_raw.sql > schema.sql
          echo "Raw lines:";  wc -l schema_raw.sql
          echo "Cleaned lines:"; wc -l schema.sql

      - name: Drop existing public schema on Field Portal (start fresh)
        env:
          FIELD_PORTAL_DB_URL: ${{ secrets.FIELD_PORTAL_DB_URL }}
        run: |
          set -o pipefail
          docker run --rm postgres:17 psql "$FIELD_PORTAL_DB_URL" -v ON_ERROR_STOP=1 -c "
            DROP SCHEMA IF EXISTS public CASCADE;
            CREATE SCHEMA public;
            GRANT ALL ON SCHEMA public TO postgres;
            GRANT ALL ON SCHEMA public TO public;
          "

      - name: Apply schema → Field Portal Sandbox
        env:
          FIELD_PORTAL_DB_URL: ${{ secrets.FIELD_PORTAL_DB_URL }}
        run: |
          set -o pipefail
          docker run --rm -v "$(pwd):/work" -w /work postgres:17 \
            psql "$FIELD_PORTAL_DB_URL" -v ON_ERROR_STOP=1 -f /work/schema.sql

      - name: Verify schema landed
        env:
          FIELD_PORTAL_DB_URL: ${{ secrets.FIELD_PORTAL_DB_URL }}
        run: |
          docker run --rm postgres:17 psql "$FIELD_PORTAL_DB_URL" -c "
            SELECT table_name FROM information_schema.tables
            WHERE table_schema='public' AND table_type='BASE TABLE'
            ORDER BY table_name;
          "
